name: rules documents

# Once a day at 04:50 UTC (after the 03:20 Rules Hub refresh, off the hour), by hand, and when its
# own files change on main (so the copy exists the day this lands). fetch-core-rules.js downloads
# Riot's Core Rules and Tournament Rules PDFs, from the links data/rules.json already holds, byte for
# byte from Riot's file host, into docs/ with data/docs.json (Riot's link, date, size, SHA-256).
# offline-list.js runs in the same commit so the worker's offline copy lists them. It commits to
# main only when a document changed; no pull request, nothing to merge. If Riot's file is not a PDF
# of a sane size the run fails and the last good copy stays.
on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch-core-rules.js
      - .github/workflows/core-rules.yml

permissions:
  contents: write

concurrency:
  group: fetch-core-rules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fetch Riot's rules documents
        run: node fetch-core-rules.js >> "$GITHUB_STEP_SUMMARY"

      - name: List them in the offline copy
        run: node offline-list.js

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/docs.json offline.json
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "data: Riot's rules documents $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
