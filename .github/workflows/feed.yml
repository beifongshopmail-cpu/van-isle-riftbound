name: refresh feed

# Every 6 hours, at 03:40, 09:40, 15:40 and 21:40 UTC (twenty minutes after
# the rules job, off the hour). workflow_dispatch is the manual run.
#
# PUBLISHES TO main (plan 2 M8.7, Mako 2026-11-07: the news page needs it
# live; was a pull request nobody merged). fetch-feed.js rewrites
# data/feed.json only when something changed, after the fixture checks pass,
# so a quiet run commits nothing.
#
# When a new item is a rules post, the rules job is started at once instead
# of waiting for its next turn.
#
# Keys: DISCORD_TOKEN (the RAVI scanner bot, reads #riot-feed),
# RECORDS_TOKEN (read-only on mako-records, reads Muse's files) and
# ANTHROPIC_API_KEY (Claude writes each post's summary; without it the
# summary is Riot's first sentence and the run still passes). A missing
# key or a refused read fails the run and GitHub emails the owner; the
# published file stays as it was.
on:
  schedule:
    - cron: "40 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fixture checks
        run: node test-feed.js

      - name: Read the Discord channel and Muse's files
        id: read
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RECORDS_TOKEN: ${{ secrets.RECORDS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-feed.js

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "no new Riot posts; nothing committed"
            exit 0
          fi
          git commit -m "data: new Riot posts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Start the rules job for a new rules post
        if: steps.read.outputs.rules == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run rules.yml --ref main
