name: fetch events

# 01:00 and 13:00 UTC. In Pacific that lands at 6pm/6am during daylight
# time and 5pm/5am during standard time. The drift is deliberate: pinning
# to local time would mean two crons that are wrong half the year.
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Fixture checks
        run: |
          node test-unknown-template.js
          node test-playriftbound.js
          node test-store-events.js

      - name: Fetch events and build feeds
        run: node fetch-events.js

      - name: Summarise
        run: |
          node -e "
          const d = require('./data/events.json');
          const lines = [];
          lines.push('| metric | value |');
          lines.push('| --- | --- |');
          lines.push('| unique events | ' + d.totals.unique + ' |');
          for (const a of d.anchors) {
            lines.push('| ' + a.name + ' (' + (a.source || '') + ') | ' + a.returned + ' |');
          }
          const sp = d.store_posts || {};
          lines.push('| store posts (digest ' + (sp.run || 'none') + ') | ' + (sp.added || 0) + ' of ' + (sp.listed || 0) + (sp.error ? ', not read: ' + sp.error : '') + ' |');
          lines.push('| towns not on the list | ' + ((d.other_towns || []).join(', ') || 'none') + ' |');
          const uk = Object.keys(d.unknown_templates);
          lines.push('| unknown templates | ' + uk.length + ' |');
          if (uk.length) {
            lines.push('');
            lines.push('New event categories seen upstream. Add them to TYPE_MAP in config.js:');
            lines.push('');
            for (const k of uk) {
              lines.push('- \`' + k + '\` x' + d.unknown_templates[k].count +
                         ' e.g. ' + d.unknown_templates[k].sample_name);
            }
          }
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Report anomalies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node report-anomalies.js
          BODY="$RUNNER_TEMP/anomaly-unknown.md"
          if [ -f "$BODY" ]; then
            gh label create unknown-template --color FFB020 --description "Upstream event category not in TYPE_MAP" 2>/dev/null || true
            OPEN=$(gh issue list --label unknown-template --state open --json number --jq "length")
            if [ "$OPEN" = "0" ]; then
              gh issue create --title "Unrecognised event template seen upstream" --label unknown-template --body-file "$BODY"
            else
              echo "an unknown-template issue is already open; not opening another"
            fi
          else
            echo "no anomalies to report"
          fi
          DROPBODY="$RUNNER_TEMP/anomaly-drop.md"
          if [ -f "$DROPBODY" ]; then
            gh label create event-drop --color FF4F9A --description "Event count fell sharply against the previous run" 2>/dev/null || true
            OPENDROP=$(gh issue list --label event-drop --state open --json number --jq "length")
            if [ "$OPENDROP" = "0" ]; then
              gh issue create --title "Event count dropped sharply" --label event-drop --body-file "$DROPBODY"
            else
              echo "an event-drop issue is already open; not opening another"
            fi
          else
            echo "no drop to report"
          fi
          STOREBODY="$RUNNER_TEMP/anomaly-stores.md"
          if [ -f "$STOREBODY" ]; then
            gh label create new-store --color 5DA5EE --description "A store new to the feed, with no short name yet" 2>/dev/null || true
            OPENSTORE=$(gh issue list --label new-store --state open --json number --jq "length")
            if [ "$OPENSTORE" = "0" ]; then
              gh issue create --title "A new store is on the calendar" --label new-store --body-file "$STOREBODY"
            else
              echo "a new-store issue is already open; not opening another"
            fi
          else
            echo "every store has a short name"
          fi
          TOWNBODY="$RUNNER_TEMP/anomaly-towns.md"
          if [ -f "$TOWNBODY" ]; then
            gh label create new-town --color 71CA5D --description "An event's town is not on the island's list" 2>/dev/null || true
            OPENTOWN=$(gh issue list --label new-town --state open --json number --jq "length")
            if [ "$OPENTOWN" = "0" ]; then
              gh issue create --title "A town is not on the island's list" --label new-town --body-file "$TOWNBODY"
            else
              echo "a new-town issue is already open; not opening another"
            fi
          else
            echo "every town is on the list"
          fi
