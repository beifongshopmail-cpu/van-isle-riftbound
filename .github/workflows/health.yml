name: data health

# Once a day at 14:25 UTC (after the day's second events run, off the hour), and when its own files
# change on main. health.js asks GitHub for each data refresh's last successful run and writes
# data/health.json, which the pages read to say in words when a refresh is late (pages.js
# RAVI_STALE). One commit a day. It only reads the other workflows' runs, so it cannot break them.
# If GitHub cannot be read the run fails and the last good file stays; the pages stop trusting a
# health file older than two days, so a failure here never shows a false alarm.
on:
  schedule:
    - cron: "25 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - health.js
      - .github/workflows/health.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Ask GitHub for each refresh's last good run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node health.js

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "data: health $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
