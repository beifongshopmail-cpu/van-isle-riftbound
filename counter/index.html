<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Offline point counter for Riftbound. Tracks points, how they were scored, and which turn they landed on.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RB Counter">
<title>Point Counter - Van Isle Riftbound</title>
<link rel="stylesheet" href="/van-isle-riftbound/fonts.css">
<style>
  :root{
    --bone:#F2F3F5;
    --dim:#828A97;
    --mute:#4E5561;
    --rule:#212429;
    --rule-hi:#343A44;
    --p1:#3FA9F5;
    --p2:#FF4F9A;
    --display:"Archivo",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;touch-action:manipulation}
  body{background:#000;color:var(--bone);font-family:var(--body);
    display:flex;flex-direction:column;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  .stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}

  .strip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 8px 4px;
    border-top:1px solid var(--rule)}
  .strip .turn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin-left:10px}
  .strip .sp{margin-left:auto}
  .strip button{flex:0 0 44px;height:34px;display:flex;align-items:center;justify-content:center;
    color:var(--bone);background:none;border:1px solid transparent;border-radius:5px;padding:0}
  .strip button:disabled{opacity:.25}
  .strip button:active{border-color:var(--rule-hi);background:rgba(255,255,255,.05)}
  .strip button svg{width:20px;height:20px;display:block}
  .modes{display:flex;flex:1;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
  .modes button{flex:1;border:0;border-radius:0;min-height:32px;padding:5px 4px;background:none;
    font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .modes button+button{border-left:1px solid var(--rule)}
  .modes button[aria-pressed="true"]{background:var(--bone);color:#000;font-weight:500}

  .field{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px 6px}
  .side{min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;overflow:hidden;border-radius:10px}
  .side[data-role="major"]{flex:1}
  .side[data-role="minor"]{flex:0 0 auto;flex-direction:row;gap:14px;padding:10px 14px;
    justify-content:center;background:#07080A;border:1px solid var(--rule)}
  .side[data-role="equal"]{flex:1}
  .side[data-role="minor"]{border-color:color-mix(in srgb, var(--c) 30%, transparent)}
  .far{transform:rotate(180deg)}

  .name{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--mute);position:relative;z-index:3}
  .side .name{color:color-mix(in srgb, var(--c) 72%, #000);order:2;margin-top:18px}
  .side[data-role="minor"] .name{order:0;margin-top:0}
  .num{font-family:var(--display);font-weight:800;line-height:.72;letter-spacing:-.03em;
    font-size:min(42vh,64vw);position:relative;z-index:3;order:1}
  .side .num{color:var(--c)}
  .side[data-role="minor"] .num{font-size:32px}
  .side[data-role="equal"] .num{font-size:min(26vh,44vw)}

  .track{position:relative;z-index:3;margin-top:26px;width:min(62vw,330px);order:3}
  .side[data-role="minor"] .track{display:none}
  .side[data-role="equal"] .name{margin-top:12px}
  .side[data-role="equal"] .track{margin-top:18px}
  .side:not([data-role="minor"]) .track{align-self:stretch;width:auto}
  .track .segs{display:flex;gap:3px}
  .track .segs i{flex:1;height:3px;background:#1B1E24;display:block}
  .side .track .segs i.on{background:var(--c)}
  .track .keys{display:flex;gap:3px;margin-top:5px}
  .track .keys b{flex:1;text-align:center;font-family:var(--mono);font-weight:400;font-size:10px;
    letter-spacing:.04em;color:var(--mute);line-height:1}
  .side .track .keys b.on{color:color-mix(in srgb, var(--c) 85%, transparent)}
  .side[data-role="minor"] .track .keys{display:none}

  .acts{display:flex;gap:10px;position:relative;z-index:3;margin-top:22px;order:4}
  .acts button{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em;
    text-transform:uppercase;padding:14px 15px 11px;min-height:48px;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--bone)}
  .side .acts button{border-bottom-color:color-mix(in srgb, var(--c) 60%, transparent)}
  .side:not([data-role="minor"]) .acts{align-self:stretch}
  .side:not([data-role="minor"]) .acts button{flex:1;padding-left:0;padding-right:0}
  .side .acts button:active{color:var(--c);
    text-shadow:0 0 20px color-mix(in srgb, var(--c) 70%, transparent)}
  .acts button:disabled{opacity:.25}
  .side[data-role="minor"] .acts{margin-top:0}
  .side[data-role="minor"] .acts button{min-height:32px;padding:7px 9px 5px;font-size:10px}
  .side[data-role="equal"] .acts{margin-top:14px}

  .seamwrap{flex:0 0 auto;padding:8px 0}
  .seam{width:100%;min-height:58px;border-radius:8px;background:none;border:1px solid var(--rule-hi);
    color:var(--bone);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:0}
  .seam em{font-family:var(--display);font-style:normal;font-weight:800;font-size:14px;
    letter-spacing:.1em;color:color-mix(in srgb, var(--bone) 45%, var(--dim));
    border-left:1px solid var(--rule-hi);padding-left:14px;margin-left:14px;
    display:flex;align-items:center;gap:.5ch;min-width:0}
  .seam em b{font-weight:800;font-size:14px;color:var(--sc);
    max-width:9ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seam:active{background:rgba(255,255,255,.08)}
  .seam:disabled{opacity:.3}
  .seam.flash{animation:seamflash .42s ease-out}
  @keyframes seamflash{
    0%{background:rgba(242,243,245,.26);border-color:var(--bone);color:#000}
    45%{background:rgba(242,243,245,.10);border-color:var(--bone)}
    100%{background:none;border-color:var(--rule-hi)}
  }
  @media (prefers-reduced-motion:reduce){ .seam.flash{animation:none} }

  .sheet{position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:30;display:none;
    flex-direction:column;padding:12px}
  .sheet.open{display:flex}
  .sheet h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);font-weight:400;margin-bottom:10px}
  .sheet ol{list-style:none;flex:1;min-height:0;overflow:auto}
  .sheet li{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:8px 0;
    border-bottom:1px solid var(--rule)}
  .sheet li span{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap}
  .sheet li.e1 b{color:var(--p1)}
  .sheet li.e2 b{color:var(--p2)}
  .sheet li.et b{color:var(--dim);font-weight:500}
  .sheet li.empty{color:var(--mute);border:0}
  .sheet .close{min-height:52px;margin-top:10px;background:none;border:0;
    border-bottom:2px solid rgba(242,243,245,.55);border-radius:0;color:var(--bone);
    font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .faces{display:flex;border-bottom:1px solid var(--rule);margin-bottom:10px}
  .faces button{flex:1;min-height:42px;background:none;border:0;border-bottom:2px solid transparent;
    border-radius:0;margin-bottom:-1px;color:var(--mute);font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;text-transform:uppercase}
  .faces button[aria-pressed="true"]{color:var(--bone);border-bottom-color:var(--bone)}
  .sheet[data-face="now"] #past{display:none}
  .sheet[data-face="past"] #log{display:none}
  #past{list-style:none;flex:1;min-height:0;overflow:auto}
  #past li{border-bottom:1px solid var(--rule);padding:0}
  #past li.empty{color:var(--mute);border:0;font-size:13px;padding:18px 0;line-height:1.5}
  .mrow{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;
    border-radius:0;padding:11px 0;text-align:left;color:var(--bone)}
  .mline{flex:1;min-width:0}
  .mtop{display:flex;align-items:baseline;gap:7px;font-size:14px}
  .mtop b{font-family:var(--mono);font-weight:500}
  .mtop .w1,.mtop .k1{color:var(--p1)}
  .mtop .w2,.mtop .k2{color:var(--p2)}
  .mtop .said{font-weight:500;color:var(--dim);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .msub{margin-top:3px;font-family:var(--mono);font-size:10px;color:var(--mute);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mday{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap;
    letter-spacing:.1em}
  .mbody{display:none;padding:0 0 10px}
  #past li.open .mbody{display:block}
  .mbody ol{list-style:none}
  .clearpast{width:100%;min-height:46px;margin-top:10px;background:none;
    border:1px solid var(--rule-hi);border-radius:6px;color:var(--mute);
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  .clearpast.armed{color:#FFB020;border-color:#FFB020}

  .win{position:absolute;left:6px;right:6px;bottom:6px;z-index:25;display:none;
    flex-direction:column;gap:10px;padding:12px;border-radius:8px;
    background:#000;border:1px solid var(--rule-hi)}
  .winrow{display:flex;gap:10px}
  .stage[data-won="1"] .win{display:flex}
  .legend{color:var(--dim)}
  .legend::before{content:"|";margin:0 7px;color:var(--rule-hi)}
  .side[data-role="minor"] .legend{display:none}
  .setup{position:absolute;inset:0;background:#000;z-index:40;display:none;
    flex-direction:column;padding:12px;overflow:hidden}
  .setup.open{display:flex}
  .setup h2{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:14px}
  .setup .grp{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .setup .grp:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .setup .pair{display:flex;gap:8px}
  .setup .pair input,.setup .pair select{flex:1;min-width:0}
  .setup label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .setup input,.setup select{width:100%;min-height:42px;background:#0A0B0E;color:var(--bone);
    border:1px solid var(--rule-hi);border-radius:6px;padding:0 10px;font-family:var(--body);
    font-size:16px;margin-bottom:8px;-webkit-appearance:none;appearance:none}
  .swatches{display:flex;gap:8px}
  .swatches button{flex:1;height:38px;border-radius:6px;border:2px solid transparent;padding:0}
  .swatches button[aria-pressed="true"]{border-color:var(--bone)}
  .setup .done.top{margin-top:0;margin-bottom:16px}
  .setup .done{min-height:52px;margin-top:auto;background:none;border:0;
    border-bottom:2px solid rgba(242,243,245,.55);border-radius:0;color:var(--bone);
    font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .concede{display:flex;gap:10px;margin-top:10px}
  .concede button{flex:1;min-height:46px;background:none;border:0;border-bottom:2px solid var(--cc);
    border-radius:0;color:var(--bone);font-family:var(--display);font-weight:800;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase}
  .concede button:active{color:var(--cc);text-shadow:0 0 20px color-mix(in srgb, var(--cc) 70%, transparent)}
  .concede button.armed{color:var(--cc);border-bottom-color:var(--cc);
    text-shadow:0 0 20px color-mix(in srgb, var(--cc) 70%, transparent)}
  .concede button:disabled{opacity:.32;color:var(--mute);border-bottom-color:var(--rule);
    text-shadow:none;pointer-events:none}
  .setup .wide{width:100%;min-height:46px;background:none;border:1px solid var(--rule-hi);
    border-radius:6px;color:var(--bone);font-family:var(--display);font-weight:800;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase}
  .setup[data-face="live"] [data-face="pre"]{display:none}
  .setup[data-face="pre"] [data-face="live"]{display:none}
  .setup[data-face="pre"] #firstgrp{border-bottom:0}
  .first{display:flex;gap:10px}
  .first button{flex:1;min-width:0;min-height:46px;background:none;border:1px solid var(--rule-hi);
    border-radius:6px;color:var(--dim);font-family:var(--display);font-weight:800;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;padding:0 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .first button[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:#000}
  .prefoot{margin-top:auto;display:flex;flex-direction:column}
  .prefoot .done{margin-top:10px}
  .setup .start{width:100%;min-height:52px;background:var(--bone);border:1px solid var(--bone);
    border-radius:6px;color:#000;font-family:var(--display);font-weight:800;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase}
  .setup .home{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;
    margin-top:10px;border:1px solid var(--rule-hi);border-radius:6px;color:var(--bone);
    font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;text-decoration:none}
  .win b{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bone);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .win button{flex:1;min-width:0;min-height:44px;padding:0 6px;background:none;border:0;
    border-bottom:2px solid rgba(242,243,245,.55);border-radius:0;
    font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--bone);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .win #unwin{border-bottom-color:transparent}
</style>
</head>
<body>
<div class="stage" id="stage" data-mode="focus" data-won="0">
  <div class="field" id="field"></div>
  <div class="strip">
    <div class="modes" id="modes" role="group" aria-label="Layout">
      <button data-mode="focus" aria-pressed="true">Focus</button>
      <button data-mode="split" aria-pressed="false">Split</button>
      <button data-mode="pass" aria-pressed="false">Pass</button>
    </div>
    <button id="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h10a5.5 5.5 0 0 1 0 11h-6"/><polyline points="8 4 4 8 8 12"/></svg></button>
    <button id="logbtn" aria-label="Log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button>
    <button id="setupbtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a1.94 1.94 0 1 1-2.74 2.74l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.94 1.94 0 0 1-3.88 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.94 1.94 0 1 1-2.74-2.74l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97h-.17a1.94 1.94 0 0 1 0-3.88h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.94 1.94 0 1 1 2.74-2.74l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47v-.17a1.94 1.94 0 0 1 3.88 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.94 1.94 0 1 1 2.74 2.74l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.94 1.94 0 0 1 0 3.88h-.09a1.6 1.6 0 0 0-1.47.97z"/></svg></button>
  </div>
  <div class="sheet" id="sheet" data-face="now">
    <div class="faces" id="faces" role="group" aria-label="History">
      <button data-face="now" aria-pressed="true">This game</button>
      <button data-face="past" aria-pressed="false">Past matches</button>
    </div>
    <ol id="log"></ol>
    <ul id="past"></ul>
    <button class="close" id="closelog">Back to the game</button>
  </div>
  <div class="win"><b id="wintext">Player 1 wins</b><div class="winrow"><button id="winlog">Log</button><button id="unwin">Undo</button><button id="again">New match</button></div></div>
  <div class="setup" id="setup" data-face="live">
    <button class="done top" id="setupdone" data-face="live">Back to the game</button>
    <h2 data-face="pre">Before the match</h2>
    <div class="grp" data-face="live">
      <label>End this game early</label>
      <div class="concede">
        <button data-concede="1" id="cc1">P1 concedes</button>
        <button data-concede="2" id="cc2">P2 concedes</button>
      </div>
    </div>
    <div class="grp" data-for="1">
      <label>Player 1</label>
      <div class="pair">
        <input type="text" id="n1" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Name">
        <select id="l1"></select>
      </div>
      <div class="swatches" id="c1"></div>
    </div>
    <div class="grp" data-for="2">
      <label>Player 2</label>
      <div class="pair">
        <input type="text" id="n2" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Name">
        <select id="l2"></select>
      </div>
      <div class="swatches" id="c2"></div>
    </div>
    <div class="grp" id="firstgrp" data-face="pre">
      <label>Who goes first</label>
      <div class="first" id="first">
        <button data-first="1" aria-pressed="true">Player 1</button>
        <button data-first="2" aria-pressed="false">Player 2</button>
      </div>
    </div>
    <div class="grp" data-face="live">
      <button class="wide" id="reset">New match</button>
      <a class="home" href="/van-isle-riftbound/">Events calendar</a>
    </div>
    <section class="prefoot" data-face="pre">
      <button class="start" id="startmatch">Start match</button>
      <button class="done" id="preback">Back to the game</button>
    </section>
  </div>
</div>
<script>
(function(){
  var GKEY = "vir.counter.game.v1";
  var MKEY = "vir.counter.mode.v1";
  var GOAL = 8;
  var MODES = ["focus","split","pass"];
  var SRC = { conquer:"Conquer", hold:"Hold", other:"Other" };
  var KEY = { conquer:"C", hold:"H", other:"O" };
  var PKEY = "vir.counter.players.v1";
  var HKEY = "vir.counter.history.v1";
  var HMAX = 50;
  var CKEY = "vir.counter.match.v1";
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var SWATCH = ["#3FA9F5","#FF4F9A","#FFB020","#4ADE80","#A78BFA","#F2F3F5"];
  var LEGENDS = ["","Annie","Ashe","Braum","Caitlyn","Darius","Diana","Ekko","Ezreal","Garen",
    "Jinx","Kai'Sa","Karma","Katarina","Lee Sin","Leona","Lucian","Lux","Master Yi","Miss Fortune",
    "Nasus","Riven","Sett","Shen","Sona","Swain","Teemo","Thresh","Tristana","Twisted Fate",
    "Vi","Viktor","Volibear","Warwick","Yasuo","Zed","Ziggs","Zoe"];
  var players = { 1:{ name:"Player 1", legend:"", colour:"#3FA9F5" },
                  2:{ name:"Player 2", legend:"", colour:"#FF4F9A" } };
  function nameOf(p){ return players[p].name || ("Player " + p); }

  var stage = document.getElementById("stage");
  var field = document.getElementById("field");
  var elModes = document.getElementById("modes");
  var elUndo = document.getElementById("undo");
  var elReset = document.getElementById("reset");
  var elWin = document.getElementById("wintext");
  var elLog = document.getElementById("log");
  var sheet = document.getElementById("sheet");
  var elPast = document.getElementById("past");

  var ev = null;
  var history = [];
  var mode = "focus";
  var wake = null;
  var firstP = 1;
  var bo = 1;
  var banked = [];

  function fresh(p){ return [ { t:"turn", p:(p === 2 ? 2 : 1), n:1 } ]; }

  function save(){ try { localStorage.setItem(GKEY, JSON.stringify(ev)); } catch (e) {} }
  function saveMode(){ try { localStorage.setItem(MKEY, mode); } catch (e) {} }
  function savePlayers(){ try { localStorage.setItem(PKEY, JSON.stringify(players)); } catch (e) {} }
  function loadPlayers(){
    try {
      var raw = localStorage.getItem(PKEY);
      if (!raw) { return; }
      var o = JSON.parse(raw);
      for (var p = 1; p <= 2; p++) {
        if (o && o[p]) {
          if (typeof o[p].name === "string") { players[p].name = o[p].name; }
          if (typeof o[p].legend === "string") { players[p].legend = o[p].legend; }
          if (typeof o[p].colour === "string" && SWATCH.indexOf(o[p].colour) >= 0) {
            players[p].colour = o[p].colour;
          }
        }
      }
    } catch (e) {}
  }

  function load(){
    try {
      var raw = localStorage.getItem(GKEY);
      if (raw) {
        var a = JSON.parse(raw);
        if (a && a.length && a[0] && a[0].t === "turn") { return a; }
      }
    } catch (e) {}
    return null;
  }
  function loadMode(){
    try {
      var m = localStorage.getItem(MKEY);
      if (MODES.indexOf(m) >= 0) { return m; }
    } catch (e) {}
    return "focus";
  }

  function loadHistory(){
    try {
      var raw = localStorage.getItem(HKEY);
      if (!raw) { return []; }
      var a = JSON.parse(raw);
      if (!a || !a.length) { return []; }
      var out = [];
      for (var i = 0; i < a.length; i++) {
        var m = a[i];
        if (m && m.v === 1 && m.games && m.games.length && m.games[0] &&
            m.games[0].ev && m.games[0].ev.length) { out.push(m); }
      }
      return out;
    } catch (e) { return []; }
  }

  function saveHistory(){
    try { localStorage.setItem(HKEY, JSON.stringify(history)); } catch (e) {}
  }

  function loadMatch(){
    try {
      var raw = localStorage.getItem(CKEY);
      if (!raw) { return; }
      var m = JSON.parse(raw);
      if (!m || m.v !== 1) { return; }
      if (m.bo === 3) { bo = 3; }
      if (m.games && m.games.length) {
        var out = [];
        for (var i = 0; i < m.games.length; i++) {
          var g = m.games[i];
          if (g && g.ev && g.ev.length && g.p) { out.push(g); }
        }
        banked = out;
      }
    } catch (e) {}
  }

  function saveMatch(){
    try { localStorage.setItem(CKEY, JSON.stringify({ v:1, bo:bo, games:banked })); } catch (e) {}
  }

  function snap(){
    return { 1:{ name:players[1].name, legend:players[1].legend, colour:players[1].colour },
             2:{ name:players[2].name, legend:players[2].legend, colour:players[2].colour } };
  }

  function archive(){
    var w = won();
    if (!w) { return; }
    history.unshift({ v:1, at:Date.now(), games:[ { ev:ev.slice(), p:snap() } ] });
    while (history.length > HMAX) { history.pop(); }
    saveHistory();
  }

  function bankGame(){
    banked.push({ ev:ev.slice(), p:snap() });
    saveMatch();
  }

  function gameWins(p){
    var c = 0;
    for (var i = 0; i < banked.length; i++) {
      if (winnerOf(banked[i].ev) === p) { c++; }
    }
    if (winnerOf(ev) === p) { c++; }
    return c;
  }

  function need(){ return bo === 3 ? 2 : 1; }

  function matchWinner(){
    if (gameWins(1) >= need()) { return 1; }
    if (gameWins(2) >= need()) { return 2; }
    return 0;
  }

  function matchOpen(){
    return bo === 3 && !matchWinner() && (gameWins(1) + gameWins(2)) > 0;
  }

  function pointsOf(p){
    var a = [];
    for (var i = 0; i < ev.length; i++) { if (ev[i].t === "point" && ev[i].p === p) { a.push(ev[i]); } }
    return a;
  }
  function score(p){ return pointsOf(p).length; }
  function turns(p){
    var c = 0;
    for (var i = 0; i < ev.length; i++) { if (ev[i].t === "turn" && ev[i].p === p) { c++; } }
    return c;
  }
  function ctx(){
    for (var i = ev.length - 1; i >= 0; i--) { if (ev[i].t === "turn") { return ev[i]; } }
    return { t:"turn", p:1, n:1 };
  }
  function winnerOf(list){
    for (var i = list.length - 1; i >= 0; i--) {
      if (list[i].t === "concede") { return list[i].p === 1 ? 2 : 1; }
    }
    var s1 = 0, s2 = 0;
    for (var j = 0; j < list.length; j++) {
      if (list[j].t === "point") {
        if (list[j].p === 1) { s1++; } else if (list[j].p === 2) { s2++; }
      }
    }
    if (s1 >= GOAL) { return 1; }
    if (s2 >= GOAL) { return 2; }
    return 0;
  }
  function won(){ return winnerOf(ev); }

  function trackOf(p){
    var pts = pointsOf(p), segs = "", keys = "";
    for (var i = 0; i < GOAL; i++) {
      var on = i < pts.length;
      var k = on ? KEY[pts[i].src] : ".";
      segs += "<i" + (on ? " class=\"on\"" : "") + "></i>";
      keys += "<b" + (on ? " class=\"on\"" : "") + ">" + k + "</b>";
    }
    return "<div class=\"track\"><div class=\"segs\">" + segs + "</div>" +
           "<div class=\"keys\">" + keys + "</div></div>";
  }

  function acts(p){
    var d = won() ? " disabled" : "";
    return "<div class=\"acts\">" +
      "<button data-p=\"" + p + "\" data-s=\"conquer\"" + d + ">Conquer</button>" +
      "<button data-p=\"" + p + "\" data-s=\"hold\"" + d + ">Hold</button>" +
      "<button data-p=\"" + p + "\" data-s=\"other\"" + d + ">Other</button></div>";
  }

  function block(p, role){
    var far = (role === "minor" && mode !== "focus") || (role === "equal" && p === 2);
    var leg = players[p].legend ? "<span class=\"legend\">" + esc(players[p].legend) + "</span>" : "";
    return "<section class=\"side p" + p + (far ? " far" : "") + "\" data-role=\"" + role +
      "\" style=\"--c:" + players[p].colour + "\">" +
      "<div class=\"name\">" + esc(nameOf(p)) + leg + "</div>" +
      "<div class=\"num\">" + score(p) + "</div>" +
      trackOf(p) + acts(p) + "</section>";
  }

  function seam(){
    var c = ctx(), d = won() ? " disabled" : "";
    return "<div class=\"seamwrap\"><button class=\"seam\" id=\"seam\"" + d +
      " style=\"--sc:" + players[c.p].colour + "\">Pass turn" +
      "<em><b>" + esc(nameOf(c.p)) + "</b> turn " + c.n + "</em></button></div>";
  }

  function logHTML(list, nm){
    var out = "";
    if (list.length <= 1) {
      out = "<li class=\"empty\">No points yet. Tap Conquer, Hold or Other when someone scores.</li>";
    }
    for (var i = list.length - 1; i >= 0; i--) {
      var e = list[i];
      if (e.t === "point") {
        out += "<li class=\"e" + e.p + "\"><b>" + esc(nm(e.p)) + " +1</b> " + SRC[e.src] +
               " <span>during " + esc(nm(e.tp)) + " T" + e.tn + "</span></li>";
      } else if (e.t === "concede") {
        out += "<li class=\"et\"><b>" + esc(nm(e.p)) + " concedes</b> <span>game over</span></li>";
      } else {
        var gained = 0, ended = false;
        for (var j = i + 1; j < list.length; j++) {
          if (list[j].t === "turn") { ended = true; break; }
          if (list[j].t === "point") { gained++; }
        }
        var tail = !ended ? "in progress"
                 : gained === 0 ? "no points"
                 : gained === 1 ? "1 point"
                 : gained + " points";
        out += "<li class=\"et\"><b>" + esc(nm(e.p)) + " turn " + e.n +
               "</b> <span>" + tail + "</span></li>";
      }
    }
    return out;
  }

  function statsOf(list){
    var s = { 1:0, 2:0, turns:0, conceded:0, first:1, src:{ conquer:0, hold:0, other:0 } };
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.t === "point") { s[e.p]++; if (s.src[e.src] !== undefined) { s.src[e.src]++; } }
      else if (e.t === "turn") { s.turns++; }
      else if (e.t === "concede") { s.conceded = e.p; }
    }
    if (list.length && list[0].t === "turn") { s.first = list[0].p; }
    return s;
  }

  function stamp(ms){
    var d = new Date(ms);
    return MON[d.getMonth()].toUpperCase() + " " + d.getDate();
  }

  function renderPast(){
    if (!history.length) {
      elPast.innerHTML = "<li class=\"empty\">No finished matches yet. A match is saved here when you start the next one.</li>";
      return;
    }
    var out = "";
    for (var i = 0; i < history.length; i++) {
      var m = history[i], g = m.games[0], nm = function(pp){ return g.p[pp].name || ("Player " + pp); };
      var s = statsOf(g.ev);
      var w = s.conceded ? (s.conceded === 1 ? 2 : 1) : (s[1] >= GOAL ? 1 : (s[2] >= GOAL ? 2 : 0));
      var said = w ? esc(nm(w)) + " beat " + esc(nm(w === 1 ? 2 : 1)) : "Unfinished";
      var legs = esc(g.p[1].legend || "No legend") + " v " + esc(g.p[2].legend || "No legend");
      var tail = s.conceded ? "conceded" : s.turns + " turns";
      out += "<li data-m=\"" + i + "\"><button class=\"mrow\" data-m=\"" + i + "\">" +
        "<span class=\"mline\">" +
          "<span class=\"mtop\"><b class=\"k1\">" + s[1] + "</b><b>v</b><b class=\"k2\">" + s[2] +
          "</b><span class=\"said w" + (w || 1) + "\">" + said + "</span></span>" +
          "<span class=\"msub\">" + legs + " &middot; " + esc(nm(s.first)) + " went first &middot; " + tail + "</span>" +
        "</span><span class=\"mday\">" + stamp(m.at) + "</span></button>" +
        "<div class=\"mbody\"><ol>" + logHTML(g.ev, nm) + "</ol></div></li>";
    }
    out += "<li class=\"empty\" style=\"padding:0\"><button class=\"clearpast\" id=\"clearpast\">Delete all past matches</button></li>";
    elPast.innerHTML = out;
  }

  function render(){
    var c = ctx(), w = won();
    stage.setAttribute("data-mode", mode);
    stage.setAttribute("data-won", w ? "1" : "0");
    elWin.textContent = nameOf(w || 1) + " wins";
    elWin.style.color = w ? players[w].colour : "";
    var mb = elModes.getElementsByTagName("button");
    for (var k = 0; k < mb.length; k++) {
      mb[k].setAttribute("aria-pressed", mb[k].getAttribute("data-mode") === mode ? "true" : "false");
    }
    elUndo.disabled = ev.length <= 1;

    var top, bot;
    if (mode === "split") { top = block(2, "equal"); bot = block(1, "equal"); }
    else if (mode === "pass") {
      var a = c.p, b = a === 1 ? 2 : 1;
      top = block(b, "minor"); bot = block(a, "major");
    } else { top = block(2, "minor"); bot = block(1, "major"); }

    field.innerHTML = top + seam() + bot;
    field.style.transform = (mode === "pass" && c.p === 2) ? "rotate(180deg)" : "none";

    elLog.innerHTML = logHTML(ev, nameOf);
  }

  function keepAwake(){
    try {
      if (navigator.wakeLock && !wake) {
        navigator.wakeLock.request("screen").then(function(l){
          wake = l;
          l.addEventListener("release", function(){ wake = null; });
        })["catch"](function(){});
      }
    } catch (e) {}
  }

  function startNew(){
    archive();
    ev = fresh(firstP);
    renderPast();
    save();
    render();
  }

  field.addEventListener("click", function(e){
    var t = e.target;
    while (t && t !== field && t.tagName !== "BUTTON") { t = t.parentNode; }
    if (!t || t === field) { return; }
    if (t.id === "seam") {
      if (!won()) {
        var c = ctx(), nx = c.p === 1 ? 2 : 1;
        ev.push({ t:"turn", p:nx, n:turns(nx) + 1 });
        save(); render(); flashSeam(); keepAwake();
      }
      return;
    }
    if (t.getAttribute("data-s")) {
      if (won()) { return; }
      var c2 = ctx();
      ev.push({ t:"point", p:parseInt(t.getAttribute("data-p"), 10),
                src:t.getAttribute("data-s"), tp:c2.p, tn:c2.n });
      save(); render(); keepAwake();
    }
  });

  elModes.addEventListener("click", function(e){
    var m = e.target.getAttribute && e.target.getAttribute("data-mode");
    if (!m || MODES.indexOf(m) < 0 || m === mode) { return; }
    mode = m;
    saveMode(); render();
  });

  function flashSeam(){
    var s = document.getElementById("seam");
    if (!s) { return; }
    s.className = "seam";
    void s.offsetWidth;
    s.className = "seam flash";
    try { if (navigator.vibrate) { navigator.vibrate(16); } } catch (e) {}
  }
  elUndo.addEventListener("click", function(){
    if (ev.length > 1) { ev.pop(); save(); render(); }
  });
  elReset.addEventListener("click", function(){ openPre(); });
  var clearArmed = false, clearTimer = null;
  function disarmClear(){
    clearArmed = false;
    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    var b = document.getElementById("clearpast");
    if (b) { b.className = "clearpast"; b.textContent = "Delete all past matches"; }
  }
  function openSheet(){
    disarmClear();
    sheet.setAttribute("data-face", "now");
    var fb = document.getElementById("faces").getElementsByTagName("button");
    for (var i = 0; i < fb.length; i++) {
      fb[i].setAttribute("aria-pressed", fb[i].getAttribute("data-face") === "now" ? "true" : "false");
    }
    renderPast();
    sheet.classList.add("open");
  }
  document.getElementById("faces").addEventListener("click", function(e){
    var f = e.target.getAttribute && e.target.getAttribute("data-face");
    if (!f) { return; }
    disarmClear();
    sheet.setAttribute("data-face", f);
    var b = this.getElementsByTagName("button");
    for (var i = 0; i < b.length; i++) {
      b[i].setAttribute("aria-pressed", b[i].getAttribute("data-face") === f ? "true" : "false");
    }
  });
  elPast.addEventListener("click", function(e){
    var t = e.target;
    while (t && t !== elPast && t.tagName !== "BUTTON") { t = t.parentNode; }
    if (!t || t === elPast) { return; }
    if (t.id === "clearpast") {
      if (!clearArmed) {
        clearArmed = true;
        t.className = "clearpast armed";
        t.textContent = "Sure? Tap again";
        clearTimer = setTimeout(disarmClear, 3000);
        return;
      }
      disarmClear();
      history = [];
      saveHistory();
      renderPast();
      return;
    }
    var mi = t.getAttribute("data-m");
    if (mi === null) { return; }
    var li = t.parentNode;
    if (li.className === "open") { li.className = ""; } else { li.className = "open"; }
  });
  document.getElementById("logbtn").addEventListener("click", openSheet);
  document.getElementById("closelog").addEventListener("click", function(){
    disarmClear();
    sheet.classList.remove("open");
  });
  document.getElementById("winlog").addEventListener("click", openSheet);
  document.getElementById("again").addEventListener("click", function(){ openPre(); });
  document.getElementById("unwin").addEventListener("click", function(){
    if (ev.length > 1) { ev.pop(); save(); render(); }
  });

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") { wake = null; keepAwake(); }
  });

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  var setup = document.getElementById("setup");
  var ccArmed = null;
  var ccTimer = null;

  function disarmConcede(){
    ccArmed = null;
    if (ccTimer) { clearTimeout(ccTimer); ccTimer = null; }
    var b1 = document.getElementById("cc1"), b2 = document.getElementById("cc2");
    if (b1) { b1.className = ""; b1.textContent = nameOf(1) + " concedes"; }
    if (b2) { b2.className = ""; b2.textContent = nameOf(2) + " concedes"; }
  }

  function buildSetup(){
    for (var p = 1; p <= 2; p++) {
      var sel = document.getElementById("l" + p), o = "";
      for (var i = 0; i < LEGENDS.length; i++) {
        o += "<option value=\"" + esc(LEGENDS[i]) + "\">" +
             (LEGENDS[i] ? esc(LEGENDS[i]) : "No legend") + "</option>";
      }
      sel.innerHTML = o;
      var sw = document.getElementById("c" + p), h = "";
      for (var j = 0; j < SWATCH.length; j++) {
        h += "<button data-p=\"" + p + "\" data-col=\"" + SWATCH[j] +
             "\" style=\"background:" + SWATCH[j] + "\" aria-pressed=\"false\"></button>";
      }
      sw.innerHTML = h;
    }
  }

  function syncConcedeLabels(){
    var w = won();
    var b1 = document.getElementById("cc1"), b2 = document.getElementById("cc2");
    if (b1) {
      if (b1.className !== "armed") { b1.textContent = nameOf(1) + " concedes"; }
      b1.style.setProperty("--cc", players[1].colour);
      b1.disabled = w ? true : false;
    }
    if (b2) {
      if (b2.className !== "armed") { b2.textContent = nameOf(2) + " concedes"; }
      b2.style.setProperty("--cc", players[2].colour);
      b2.disabled = w ? true : false;
    }
  }

  function syncFirst(){
    var b = document.getElementById("first").getElementsByTagName("button");
    for (var i = 0; i < b.length; i++) {
      var p = parseInt(b[i].getAttribute("data-first"), 10);
      b[i].textContent = nameOf(p);
      b[i].setAttribute("aria-pressed", p === firstP ? "true" : "false");
    }
  }

  function openPre(){
    disarmConcede();
    syncSetup();
    syncFirst();
    setup.setAttribute("data-face", "pre");
    setup.classList.add("open");
  }

  function closeSetup(){
    setup.classList.remove("open");
    setup.setAttribute("data-face", "live");
  }

  function syncSetup(){
    syncConcedeLabels();
    for (var p = 1; p <= 2; p++) {
      document.getElementById("n" + p).value = players[p].name;
      document.getElementById("l" + p).value = players[p].legend;
      var bs = document.getElementById("c" + p).getElementsByTagName("button");
      for (var i = 0; i < bs.length; i++) {
        bs[i].setAttribute("aria-pressed",
          bs[i].getAttribute("data-col") === players[p].colour ? "true" : "false");
      }
    }
  }

  setup.addEventListener("click", function(e){
    var t = e.target;
    var fp = t.getAttribute && t.getAttribute("data-first");
    if (fp) {
      firstP = parseInt(fp, 10);
      syncFirst();
      return;
    }
    var col = t.getAttribute && t.getAttribute("data-col");
    if (col) {
      players[parseInt(t.getAttribute("data-p"), 10)].colour = col;
      savePlayers(); syncSetup(); render();
      return;
    }
    var cc = t.getAttribute && t.getAttribute("data-concede");
    if (cc) {
      if (won()) { syncConcedeLabels(); return; }
      if (t.disabled) { return; }
      if (ccArmed !== cc) {
        disarmConcede();
        ccArmed = cc;
        t.className = "armed";
        t.textContent = "Sure? Tap again";
        ccTimer = setTimeout(disarmConcede, 3000);
        return;
      }
      disarmConcede();
      ev.push({ t:"concede", p:parseInt(cc, 10) });
      save(); render();
      setup.classList.remove("open");
    }
  });

  function onSetupField(e){
    var id = e.target.id;
    if (!id) { return; }
    var p = parseInt(id.charAt(1), 10);
    if (id.charAt(0) === "n") { players[p].name = e.target.value.slice(0, 14); }
    else if (id.charAt(0) === "l") { players[p].legend = e.target.value; }
    else { return; }
    savePlayers(); syncConcedeLabels(); syncFirst(); render();
  }
  setup.addEventListener("input", onSetupField);
  setup.addEventListener("change", onSetupField);

  document.getElementById("setupbtn").addEventListener("click", function(){
    disarmConcede(); syncSetup();
    setup.setAttribute("data-face", "live");
    setup.classList.add("open");
  });
  document.getElementById("setupdone").addEventListener("click", closeSetup);
  document.getElementById("preback").addEventListener("click", closeSetup);
  document.getElementById("startmatch").addEventListener("click", function(){
    startNew();
    closeSetup();
  });

  mode = loadMode();
  loadPlayers();
  history = loadHistory();
  loadMatch();
  ev = load() || fresh();
  buildSetup();
  renderPast();
  render();
})();
</script>
</body>
</html>
