<style>
/* The feedback page. CARD SYSTEM, converted 2026-09-22. The shared layer
   (tokens, glass, frost, the bar, menus, the footer) is app.css, linked
   above. This block holds only the feedback page's own rules. The spec is
   the round-2 mockup, "RAVI counter and feedback mockup". */
html{background:var(--ground)}
/* LINKS TAKE THE COLOUR OF WHAT HOLDS THEM. app.css does not set this, and
   without it the bar's Hub icon drew in link purple. */
a{color:inherit;text-decoration:none}
body{-webkit-font-smoothing:antialiased;
  /* THIS DOES NOT STOP DOUBLE-TAP ZOOM. The touchend guard at the end of
     the page is the fix; this declaration is correct and free. */
  touch-action:manipulation}
#fb{max-width:480px;margin:0 auto;
  padding:0 12px calc(max(4px,calc(env(safe-area-inset-bottom,0px) - 12px)) + var(--barH) + 40px)}
/* the form sits in a glass card. Tally draws its own fields and colours;
   those are set in Tally, not here. */
/* ONE WAY TO THE FORM (plan 2 M5, Mako's yes 2026-11-02): the form shows on arrival in its
   group; no Send feedback fold row, and the bar no longer links out to Tally's own page */
.fgrp{margin:0 0 12px}
.fbody{padding:8px 8px 8px;min-height:200px}
.fbody iframe{display:block;width:100%;border:0;background:transparent}
#planned,#shipped,#send{margin-top:22px}
#planned{margin-top:4px}
/* PLANNED AND RECENTLY SHIPPED (plan 2 M8.7 block 2, Mako 2026-11-07): from data/changes.json,
   kept by hand. Every line is one short title on one row, beside its page's icon chip in the page's
   colour (the icon's shape carries it, never the colour alone); a tap opens the line's detail under
   it, in place, with its page's name (Mako: less wall of text, still telling enough). Recently shipped shows the three newest
   updates, a group each under its date; All updates opens every one. */
.cdl{margin:14px 4px 6px;font-size:12px;font-weight:600;color:var(--muted)}
#alist .doors{margin:0 0 14px}
.cdl:first-child{margin-top:0}
.cdl small{font-weight:400}
.ci{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--c),.34);color:var(--bone)}
.ci svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.door.rec.cr{flex-direction:row;align-items:center;gap:12px}   /* one line on a phone; a long title wraps rather than clips (the chevron sits as every record's) */
.cr .t{white-space:normal}
.cr .chev{position:absolute;top:calc(50% - 8px);right:16px;color:var(--muted)}   /* where every record's chevron sits (app.css .door.rec .cvr) */
/* a row's detail opens under it, in place (Mako 2026-11-07 20:24, as Movers opens): the page's name
   lit in its colour and when, then the line in a sentence; lined up with the title */
.cx{padding:0 16px 12px 60px}
.cpg{margin:0 0 2px;font-family:var(--disp);font-size:12px;font-weight:700;color:rgb(var(--cl))}
.cpg small{font-family:var(--text);font-size:12px;font-weight:400;color:var(--muted)}
.cds{margin:0;font-size:15px;line-height:1.4;color:var(--bone)}
.callg{margin-top:8px}
.foot a{color:var(--bone)}
</style>
</head>

<main id="fb">
  <h2 class="sr">Feedback</h2>
  <!-- PLANNED, RECENTLY SHIPPED, THEN THE FORM (plan 2 M8.7 block 2, Mako 2026-11-07: before testers; no
       lede). Both come from data/changes.json, kept by hand at every block that ships something a player
       would notice (records: RULE -- keep the feedback page's Planned and Recently shipped current). -->
  <section id="planned" hidden>
    <div class="shead"><h2>Planned</h2><span class="sp"></span><span class="cnt" id="pcnt"></span></div>
    <div class="doors" id="plist" data-k="open"></div>
  </section>

  <section id="shipped" hidden>
    <div class="shead"><h2>Recently shipped</h2></div>

    <div class="doors callg" data-k="deeper"><button type="button" class="door btn glass" id="sall"><span class="t">All updates</span><span class="sp"></span><small id="scnt"></small><svg class="cvr" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button></div>

  </div>
  </div>

  <footer class="foot">

    <p>Built and maintained by <a href="https://beifonghithouse.com">Beifong's Hit-House</a>, Victoria BC.</p>
  </footer>

<!-- THE STANDARD BAR. Slots never move between pages: Settings is here,
     dimmed in place, because this page has none. -->
<nav class="bar frost" id="tabs"></nav>
<script>RAVI_BAR(document.getElementById("tabs"), [
  "hub",
  {go:"feedback"},
  {tag:"button", icon:"soon", a:[["class", "tab"], ["disabled", null], ["aria-label", "Nothing here yet"], ["data-k", "slot"]]},
  {tag:"button", icon:"gear", a:[["class", "tab"], ["disabled", null], ["aria-label", "No settings on this page"], ["data-k", "slot"]]}
]);</script>

<div class="scrim" id="scrim"></div>
<section class="panel frost tray" id="pnav" aria-hidden="true" aria-label="Pages">
  <div class="pbody"><div class="goto" id="pnavgoto"></div></div>
</section>
<section class="panel frost" id="pall" aria-hidden="true" aria-label="All updates">
  <div class="phead"><div class="ht"><h4 class="ttl">All updates</h4></div><button type="button" class="circ btn glass" data-close aria-label="Close" data-k="do"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
  <div class="pbody" id="alist"></div>
</section>

<script>
(function(){
  // Two menus on this page: Go to and All updates, one at a time. While one is open the page is
  // locked at the root (html.lock in app.css); the body is never pinned.
  var scrim = document.getElementById("scrim"), OPENP = null;
  function el(id){ return document.getElementById(id); }
  function show(p){
    if(OPENP && OPENP !== p){ OPENP.classList.remove("show"); OPENP.setAttribute("aria-hidden", "true"); }
    OPENP = p || null;
    if(p){
      p.classList.add("show"); p.setAttribute("aria-hidden", "false"); scrim.classList.add("show"); document.documentElement.classList.add("lock");
      var b = p.querySelector(".pbody"); if(b) b.scrollTop = 0;
    } else { scrim.classList.remove("show"); document.documentElement.classList.remove("lock"); }
    window.RAVI_EDGES && window.RAVI_EDGES();
  }
  el("tabnav").addEventListener("click", function(){ show(OPENP === el("pnav") ? null : el("pnav")); });
  window.RAVI_GOTO(el("pnavgoto"), "feedback", "../");
  el("pnhere").addEventListener("click", function(){ show(null); });
  scrim.addEventListener("click", function(){ show(null); });
  document.addEventListener("click", function(ev){ if(ev.target.closest("[data-close]")) show(null); });

  // ---- PLANNED AND RECENTLY SHIPPED, from data/changes.json ----
  function esc(t){ return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var PG = {};
  (window.RAVI_PAGES || []).forEach(function(p){ PG[p.id] = p; });
  // a line's page: its name, colour and icon; the whole app wears white and the hub's icon
  function page(id){
    if(id === "hub") return { name: "Hub", rgb: "240,240,245", icon: window.RAVI_ICON("hub") };
    var p = PG[id];
    return p ? { name: p.name, rgb: p.rgb, icon: p.icon } : { name: "Whole app", rgb: "240,240,245", icon: window.RAVI_ICON("hub") };
  }
  function lit(rgb){ return rgb.split(",").map(function(c){ return Math.round(+c + (255 - +c) * .40); }).join(","); }
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>', NX = 0;
  // a line: its title on a row that opens in place (kind open), its detail under it
  function line(it, when){
    var g = page(it.page), id = "cx" + (NX++);
    return '<button type="button" class="door btn glass rec cr" data-k="open" aria-expanded="false" aria-controls="' + id + '" style="--c:' + g.rgb + ';--cl:' + lit(g.rgb) + '">'
      + '<span class="ci" aria-hidden="true">' + g.icon + '</span><span class="t">' + esc(it.t) + '</span>' + CHEV + '</button>'
      + '<div class="cx" id="' + id + '" style="--cl:' + lit(g.rgb) + '" hidden><p class="cpg">' + esc(g.name) + ' <small>' + esc(when || "Planned") + '</small></p>'
      + '<p class="cds sel">' + esc(it.d || it.t) + '</p></div>';
  }
  function update(u){
    var when = window.RAVI_DATE(new Date(u.date + "T12:00:00"));
    return '<p class="lb cdl">' + esc(u.v ? "Version " + u.v : when) + (u.v ? ' <small>' + esc(when) + '</small>' : '') + '</p>'
      + '<div class="doors" data-k="open">' + u.items.map(function(it){ return line(it, when); }).join("") + '</div>';
  }
  document.addEventListener("click", function(ev){
    var b = ev.target.closest(".cr[aria-controls]"); if(!b) return;
    var x = el(b.getAttribute("aria-controls")), on = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", on ? "true" : "false");
    if(x){ x.hidden = !on; if(on){ x.classList.remove("reveal"); void x.offsetWidth; x.classList.add("reveal"); } }
  });
  fetch("../data/changes.json", { cache: "no-cache" }).then(function(r){ return r.json(); }).then(function(d){
    var pl = Array.isArray(d.planned) ? d.planned : [], sh = Array.isArray(d.shipped) ? d.shipped.filter(function(u){ return u && u.date && Array.isArray(u.items) && u.items.length; }) : [];
    if(pl.length){ el("plist").innerHTML = pl.map(function(it){ return line(it, ""); }).join(""); el("pcnt").textContent = pl.length; el("planned").hidden = false; }
    if(sh.length){
      el("slist").innerHTML = sh.slice(0, 3).map(update).join("");
      el("alist").innerHTML = sh.map(update).join("");
      el("scnt").textContent = sh.length;
      el("shipped").hidden = false;
    }
  }).catch(function(){});
  el("sall").addEventListener("click", function(){ show(el("pall")); });
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap still starts the timer, so a quick tap on words after a control
  // (a menu opened by its row) is held off too.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early; pages.js holds off page pinch-zoom
  // (2026-11-02). Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    var tch = ev.changedTouches[0];
    var now = Date.now();
    // A control's tap goes through at once, but starts the timer: a quick second tap on a menu's
    // words or a gap after tapping the row that opened it is still a double-tap to iPhone
    // (plan 2 M8 close-out, Mako 2026-11-04: tap-to-zoom in menus).
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = now; lastX = tch.clientX; lastY = tch.clientY;
      return;
    }
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
