<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="pages.js"></script>
<script>
(function(){
  // THE OPEN-TO CHECK. If the visitor asked for the hub explicitly
  // (?hub in the URL), the hub always shows. Otherwise, if a page has
  // been chosen in Settings, the hub sends the visitor straight there.
  if (location.search.indexOf("hub") !== -1) { return; }
  try {
    var id = localStorage.getItem("vir.hub.open.v1");
    if (id && window.RAVI_PAGES) {
      for (var i = 0; i < window.RAVI_PAGES.length; i++) {
        if (window.RAVI_PAGES[i].id === id) {
          if (window.RAVI_PAGES[i].path) { window.RAVI_AWAY = true; location.replace(window.RAVI_PAGES[i].path); }
          break;
        }
      }
    }
  } catch (e) {}
})();
</script>
<meta name="theme-color" content="#08090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAVI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>RAVI</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<style>
/* The hub. No bottom bar: this page IS the bar's Hub slot's destination. */
html{background:var(--ground)}
body{-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

.top{height:max(260px,42vh);display:flex;flex-direction:column;
  /* the name centres between the settings button's bottom and the middle
     block's top */
  justify-content:center;padding-top:calc(var(--top-clear) + 36px);padding-bottom:78px;
  position:relative;flex:0 0 auto;
  /* ONE LINE: replace with an image or texture */
  background:var(--ground)}
.hubname{margin:0;text-align:center;font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.01em;color:var(--bone)} /* rung-exempt: the wordmark */
.hubgear{position:absolute;top:var(--top-clear);right:12px}
/* THE LAUNCH INTRO (STYLE.md, Motion). While it plays the name is four
   capitals that travel, and .introfull is the full name laid over them.
   The script builds both only while it plays; at rest the name is the
   plain wordmark above. Reduced motion never gets here. */
.hubname.intro{position:relative}
.hubname.intro span{display:inline-block}
.introfull{position:absolute;left:50%;top:50%;width:max-content;text-align:center;white-space:nowrap;pointer-events:none;
  font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.01em;line-height:1.15;color:var(--bone);
  transform-origin:50% 50%} /* rung-exempt: the wordmark */
.hubname.intro .introfull .il{display:block}
.introfull span span{display:inline-block}

.low{position:relative;margin-top:-40px;
  border-radius:50% 50% 0 0 / 40px 40px 0 0;padding:0 12px;
  flex:1 0 auto;display:flex;flex-direction:column}

.grid{margin-top:-24px;display:flex;flex-wrap:wrap;justify-content:center;
  row-gap:18px;column-gap:12px;padding:0 8px;max-width:420px;margin-left:auto;margin-right:auto}
.blk{width:calc((100% - 24px) / 3);aspect-ratio:1/1;border-radius:20px;padding:11px;
  display:flex;flex-direction:column;justify-content:space-between;color:var(--bone);
  text-decoration:none;transition:transform .16s ease,filter .16s ease;
  /* a solid base under the tint, the colour the plate shows through, so
     the plate's edge never shows through a block */
  background:linear-gradient(rgba(var(--cl),.25),rgba(var(--cl),.25)),linear-gradient(var(--glass),var(--glass)),var(--ground);
  /* the drop shadow is the calendar card's; it lifts the block off the plate */
  box-shadow:inset 0 -10px 18px -14px rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.45);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.blk:active{transform:scale(.97);filter:brightness(1.2);transition-duration:.08s}
.blk.dead{background:linear-gradient(var(--glass),var(--glass)),var(--ground);opacity:.4;pointer-events:none}
.blk.dead:active{transform:none;filter:none}
.blk .bi{width:24px;height:24px}
.blk .bi svg{width:100%;height:100%}
.blk .bn{font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the arc gives about 10px; the extra 4px exaggerates the curve, Mako's call. */
.grid > .blk:nth-child(2), .grid > .blk:nth-child(5){top:-14px}
/* a last row of two spreads a little, so it doesn't hug the centre gap */
.grid > .blk:nth-child(3n+1):nth-last-child(2), .grid > .blk:nth-child(3n+1):nth-last-child(2) + .blk{margin:0 5px}

.hubfoot{margin-top:auto;padding:28px 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.hubfoot p{margin:0;text-align:center;font-family:var(--text);font-size:12px;line-height:1.4;color:var(--muted)}

/* Settings reuses the card system's panel, scrim and html.lock. */
.oponote{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 2px 0}

/* THE HUB'S MENU HANGS FROM ITS BUTTON: positioned under the gear, sliding
   down from it, with app.css's own open and close. NEVER SET opacity OR
   pointer-events ON #pset: an id outranks .panel.show and the open menu
   goes invisible. */
#pset{
  top:calc(var(--top-clear) + 36px + 8px);
  bottom:auto;
  left:12px;right:12px;
  max-height:calc(100vh - var(--top-clear) - 36px - 8px - env(safe-area-inset-bottom,0px) - 16px);
  transform:translateY(-12px);
}
#pset.show{transform:none}
</style>
</head>
<body>

<div class="top">
  <h1 class="hubname"><span class="logo1">RA</span><span class="logo2">VI</span></h1>
  <button type="button" class="circ btn glass hubgear" id="hubset" aria-label="Settings" data-k="do" data-fills="pset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="ico"><path d="M9.90 4.90 L10.29 2.76 L13.71 2.76 L14.10 4.90 L15.53 5.50 L17.32 4.25 L19.75 6.68 L18.50 8.47 L19.10 9.90 L21.24 10.29 L21.24 13.71 L19.10 14.10 L18.50 15.53 L19.75 17.32 L17.32 19.75 L15.53 18.50 L14.10 19.10 L13.71 21.24 L10.29 21.24 L9.90 19.10 L8.47 18.50 L6.68 19.75 L4.25 17.32 L5.50 15.53 L4.90 14.10 L2.76 13.71 L2.76 10.29 L4.90 9.90 L5.50 8.47 L4.25 6.68 L6.68 4.25 L8.47 5.50Z"/><circle cx="12" cy="12" r="3"/></g><g class="icf"><mask id="rvs-hub-set" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#000" stroke="none"/><path d="M9.90 4.90 L10.29 2.76 L13.71 2.76 L14.10 4.90 L15.53 5.50 L17.32 4.25 L19.75 6.68 L18.50 8.47 L19.10 9.90 L21.24 10.29 L21.24 13.71 L19.10 14.10 L18.50 15.53 L19.75 17.32 L17.32 19.75 L15.53 18.50 L14.10 19.10 L13.71 21.24 L10.29 21.24 L9.90 19.10 L8.47 18.50 L6.68 19.75 L4.25 17.32 L5.50 15.53 L4.90 14.10 L2.76 13.71 L2.76 10.29 L4.90 9.90 L5.50 8.47 L4.25 6.68 L6.68 4.25 L8.47 5.50Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#000" stroke="none"/></mask><rect width="24" height="24" fill="currentColor" stroke="none" mask="url(#rvs-hub-set)"/></g></svg></button>
</div>

<div class="low glass">
  <nav class="grid" id="grid" aria-label="Pages"></nav>

  <footer class="hubfoot">
    <p>RAVI was created under Riot Games' Legal Jibber Jabber policy using assets owned by Riot Games. Riot Games does not endorse or sponsor this project.</p>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="panel frost opento" id="pset" aria-hidden="true" aria-label="Settings">
  <div class="phead">
    <h4 class="ttl">Settings</h4>
    <button type="button" class="circ btn glass" id="psclose" aria-label="Close" data-k="do"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pbody">
    <p class="lb">Open the app to</p>
    <div class="pick" id="opento" data-k="pick"></div>
    <p class="oponote">The app opens to the page you pick here. Tap Hub on any page to come back.</p>
  </div>
</section>

<script>
// THE LAUNCH INTRO (STYLE.md, Motion). The first time the hub shows in a
// launch, 'Rift App' (blue) over 'Van Isle' (pink) turns into RAVI in
// three beats: the two lines come in a size larger and are read, the small
// letters dim so the four capitals stand out, then the small letters go
// and the capitals close up, up, down and in, shrinking into the wordmark.
// About 2s; nothing waits on it, and any tap finishes it. The flag is in session storage, which the installed
// app keeps until it is fully closed. A launch that opens straight to
// another page (Settings, Open the app to) leaves it for the first time
// the hub does show. Reduced motion, no storage or no Web Animations skips
// it. window.RAVI_INTRO is the list the hub's blocks add their rise to.
(function(){
  var h = document.querySelector(".hubname"), top = h ? h.parentNode : null;
  if (!h || window.RAVI_AWAY) { return; }
  try {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
    if (!h.animate || !document.fonts || !document.fonts.load) { return; }
    if (sessionStorage.getItem("ravi.intro.v1")) { return; }
    sessionStorage.setItem("ravi.intro.v1", "1");
  } catch (e) { return; }
  var ALL = window.RAVI_INTRO = [], MINE = [];
  var rest = h.innerHTML, ov = null, done = false;
  var E = "cubic-bezier(.22,.72,.2,1)";
  // The capitals are measured in the wordmark's own font, so the name
  // waits for it, hidden. If it is slow, RAVI shows plainly instead.
  h.style.visibility = "hidden";
  // Nothing in the intro may widen the page while it plays.
  top.style.overflow = "hidden";
  var late = setTimeout(end, 800);
  document.addEventListener("pointerdown", skip, true);
  // Once the font is in, wait two frames so the launch layout has
  // settled before anything is measured.
  function soon(){ requestAnimationFrame(function(){ requestAnimationFrame(go); }); }
  document.fonts.load("800 34px Poppins").then(soon, soon);

  function skip(){
    for (var i = 0; i < ALL.length; i++) { try { ALL[i].finish(); } catch (e) {} }
  }
  function end(){
    if (done) { return; }
    done = true;
    clearTimeout(late);
    document.removeEventListener("pointerdown", skip, true);
    if (ov && ov.parentNode) { ov.parentNode.removeChild(ov); }
    h.innerHTML = rest;
    h.className = "hubname";
    h.removeAttribute("style");
    top.style.overflow = "";
    if (window.scrollX) { window.scrollTo(0, window.scrollY); }
  }
  // One element's moves on the intro's clock: [time in ms, style, easing
  // to the next step], from 0 to the end time T.
  function run(el, steps, T){
    var k = [], i, p, f;
    for (i = 0; i < steps.length; i++) {
      f = {};
      for (p in steps[i][1]) { f[p] = steps[i][1][p]; }
      f.offset = steps[i][0] / T;
      if (steps[i][2]) { f.easing = steps[i][2]; }
      k.push(f);
    }
    var a = el.animate(k, { duration: T, fill: "both" });
    MINE.push(a); ALL.push(a);
  }
  function go(){
    if (done) { return; }
    clearTimeout(late);
    var i, j, q;
    var LINES = [[["R", "ift"], ["A", "pp"]], [["V", "an"], ["I", "sle"]]];
    var COL = ["logo1", "logo1", "logo2", "logo2"];
    // the wordmark as four capitals, each at its place at rest. Every
    // piece starts at opacity 0 in its own style, so no frame can show the
    // pieces in place before their moves begin.
    h.className = "hubname intro";
    h.innerHTML = "<span class=\"logo1\" style=\"opacity:0\">R</span><span class=\"logo1\" style=\"opacity:0\">A</span>" +
      "<span class=\"logo2\" style=\"opacity:0\">V</span><span class=\"logo2\" style=\"opacity:0\">I</span>";
    // the full name over it, inside the name itself, so the two move
    // together if the page settles while the intro plays
    var s = "", c = 0;
    for (i = 0; i < LINES.length; i++) {
      s += "<span class=\"il " + COL[i * 2] + "\">";
      for (j = 0; j < LINES[i].length; j++) {
        if (j) { s += "<span class=\"lc\" style=\"opacity:0\">&#160;</span>"; }
        s += "<span class=\"ic " + COL[c++] + "\">" + LINES[i][j][0] + "</span>";
        var t = LINES[i][j][1];
        for (q = 0; q < t.length; q++) { s += "<span class=\"lc\" style=\"opacity:0\">" + t.charAt(q) + "</span>"; }
      }
      s += "</span>";
    }
    ov = document.createElement("span");
    ov.className = "introfull";
    ov.setAttribute("aria-hidden", "true");
    ov.innerHTML = s;
    h.appendChild(ov);
    // the full name starts up to 1.4 times the wordmark's size, inside the
    // 16px gutters, centred on the screen
    var wide = 0, ls = ov.querySelectorAll(".il");
    for (i = 0; i < ls.length; i++) {
      var a0 = ls[i].firstChild.getBoundingClientRect(), a1 = ls[i].lastChild.getBoundingClientRect();
      wide = Math.max(wide, a1.right - a0.left);
    }
    var fit = Math.min(1.4, (top.clientWidth - 32) / Math.max(1, wide));
    ov.style.transform = "translate(-50%,-50%) scale(" + fit + ")";
    // where each capital starts, as a move from its place at rest
    var cap = h.querySelectorAll(".hubname > .logo1, .hubname > .logo2"), ic = ov.querySelectorAll(".ic"), M = [];
    for (i = 0; i < 4; i++) {
      var r0 = ic[i].getBoundingClientRect(), r1 = cap[i].getBoundingClientRect();
      M.push("translate(" + (r0.left + r0.width / 2 - (r1.left + r1.width / 2)) + "px," +
        (r0.top + r0.height / 2 - (r1.top + r1.height / 2)) + "px) scale(" + (r0.width / Math.max(1, r1.width)) + ")");
      ic[i].style.visibility = "hidden";
    }
    h.style.visibility = "";
    // in by .4s and read until .75s; the small letters dim to .3 by 1s and
    // hold to 1.3s; then they go by 1.5s while the capitals close up and
    // shrink into the wordmark by 2s
    var T = 2000;
    for (i = 0; i < 4; i++) {
      var sh = " translateY(" + (i < 2 ? -10 : 10) + "px)";
      run(cap[i], [[0, { transform: M[i] + sh, opacity: 0 }, E], [400, { transform: M[i], opacity: 1 }],
        [1300, { transform: M[i], opacity: 1 }, E], [T, { transform: "none", opacity: 1 }]], T);
    }
    for (i = 0; i < ls.length; i++) {
      var lcs = ls[i].querySelectorAll(".lc"), dl = i ? 10 : -10;
      for (j = 0; j < lcs.length; j++) {
        run(lcs[j], [[0, { transform: "translateY(" + dl + "px)", opacity: 0 }, E], [400, { transform: "none", opacity: 1 }],
          [750, { transform: "none", opacity: 1 }, "ease"], [1000, { transform: "none", opacity: .3 }],
          [1300, { transform: "none", opacity: .3 }, "ease"], [1500, { transform: "none", opacity: 0 }],
          [T, { transform: "none", opacity: 0 }]], T);
      }
    }
    Promise.all(MINE.map(function(a){ return a.finished; })).then(end, end);
  }
})();
</script>
<script>
(function(){
  var PAGES = window.RAVI_PAGES || [];

  // THE GRID. Three per row, always: the blocks are the calendar .ev
  // body recipe, coloured by each page's own rgb. A page with no path is
  // a dead placeholder: a div, not a link, dimmed and inert.
  var grid = document.getElementById("grid");
  var h = "";
  for (var i = 0; i < PAGES.length; i++) {
    var p = PAGES[i];
    if (p.path) {
      h += '<a class="blk glass" href="' + p.path + '" style="--cl:' + p.rgb + '" data-k="do"><span class="bi">' + p.icon + '</span><span class="bn">' + p.name + '</span></a>';
    } else {
      h += '<div class="blk glass dead" aria-disabled="true"><span class="bi">' + p.icon + '</span><span class="bn">' + p.name + '</span></div>';
    }
  }
  grid.innerHTML = h;
  // THE BLOCKS RISE IN ONCE PER LAUNCH, with the launch intro (STYLE.md,
  // Motion): one after another, while the name is being read, all done by
  // about 1.25s. Any other visit to the hub shows them at rest.
  if (window.RAVI_INTRO && grid.animate) {
    var bk = grid.children;
    for (var bj = 0; bj < bk.length; bj++) {
      var bo = getComputedStyle(bk[bj]).opacity;
      window.RAVI_INTRO.push(bk[bj].animate(
        [{ transform: "translateY(14px) scale(.96)", opacity: 0 }, { transform: "none", opacity: bo }],
        { duration: 520, delay: 300 + bj * 60, easing: "cubic-bezier(.22,.72,.2,1)", fill: "backwards" }));
    }
  }

  // SETTINGS: a scrim-and-panel menu like every other page's, locking the
  // page at the root while open.
  var pset = document.getElementById("pset"), scrim = document.getElementById("scrim"), open = false;
  function setOpen(on){
    open = on;
    if (on) { pset.classList.add("show"); scrim.classList.add("show"); document.documentElement.classList.add("lock"); }
    else { pset.classList.remove("show"); scrim.classList.remove("show"); document.documentElement.classList.remove("lock"); }
    pset.setAttribute("aria-hidden", on ? "false" : "true");
  }
  document.getElementById("hubset").addEventListener("click", function(){ renderOpenTo(); setOpen(true); });
  document.getElementById("psclose").addEventListener("click", function(){ setOpen(false); });
  scrim.addEventListener("click", function(){ setOpen(false); });

  function currentChoice(){
    try { return localStorage.getItem("vir.hub.open.v1") || ""; } catch (e) { return ""; }
  }

  function renderOpenTo(){
    var cur = currentChoice();
    var rows = '<button type="button" class="' + (cur === "" ? "on " : "") + '" data-id="">Hub</button>';
    for (var i = 0; i < PAGES.length; i++) {
      var p = PAGES[i];
      if (!p.path) { continue; }
      rows += '<button type="button" class="' + (cur === p.id ? "on " : "") + '" data-id="' + p.id + '">' + p.name + '</button>';
    }
    document.getElementById("opento").innerHTML = rows;
  }

  document.getElementById("opento").addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) { return; }
    var id = t.getAttribute("data-id");
    try {
      if (id) { localStorage.setItem("vir.hub.open.v1", id); }
      else { localStorage.removeItem("vir.hub.open.v1"); }
    } catch (err) {}
    renderOpenTo();
  });
  /* iOS only fires the pressed state on non-button elements while a touch
     listener exists at document level. The event cards are links. */
  document.addEventListener("touchstart", function(){}, {passive:true});
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap resets the timer so a control tap never arms the guard for
  // whatever is tapped next.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early, so pinch-to-zoom still
  // works. Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = 0;
      return;
    }
    var tch = ev.changedTouches[0];
    var now = Date.now();
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
</body>
</html>
