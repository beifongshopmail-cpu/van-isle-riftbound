<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="pages.js"></script>
<script src="account.js"></script>
<script>
(function(){
  // THE OPEN-TO CHECK. If the visitor asked for the hub explicitly
  // (?hub in the URL), the hub always shows. Otherwise, if a page has
  // been chosen in Settings, the hub sends the visitor straight there.
  if (location.search.indexOf("hub") !== -1) { return; }
  try {
    var id = localStorage.getItem("vir.hub.open.v1");
    if (id && window.RAVI_PAGES) {
      for (var i = 0; i < window.RAVI_PAGES.length; i++) {
        if (window.RAVI_PAGES[i].id === id) {
          if (window.RAVI_PAGES[i].path) { window.RAVI_AWAY = true; location.replace(window.RAVI_PAGES[i].path); }
          break;
        }
      }
    }
  } catch (e) {}
})();
</script>

/* The hub. No bottom bar: this page IS the bar's Hub slot's destination. */
html{background:var(--ground)}
/* the hub fits every phone, so it never rubber-bands past its edges (Mako 2026-10-31), and it
   does not scroll at all, the counter's way (Mako 2026-11-01): iOS opens an installed app one
   status bar short and stretches it to the full screen, and about half the time a page that could
   scroll was left drawn about 61pt low, taps landing where it really was; a page that cannot
   scroll cannot be left scrolled. A phone too short for the hub gets scrolling back (html.scrolls,
   set by the script below once the page has settled). */
html,body{overscroll-behavior:none;overflow:hidden}
html.scrolls{overflow-y:scroll}
html.scrolls body{overflow:visible}
body{-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:relative;
  /* THE HUB'S TEXTURE (Mako 2026-10-31): the domain runes on Mako's own layout
     and tilt, each a black coin with a bevelled rim, its glyph pressed in, the lit
     edges in the domain's colour, lit only lighter, never darker than the
     ground. Only the coins are drawn: the image is transparent around them,
     so the black between is this ground exactly.
     One still image for the whole page; the plate frosts the lower part.
     Made by rb-tools design/hub-texture/ from Riot's rune files. */
  background:var(--ground) url(img/hub-runes.webp) center top/cover no-repeat}
/* THE GLOW (Mako 2026-10-31): the symbols glow from inside, in their domain's
   colour, as if lit from under the coin, in one of three ways: rings (rings of
   light grow from three places in turn; the first hub of a session always
   plays this), waves (a wave with a fainter echo, from somewhere new each time)
   or twinkle (about eight symbols at a time light up and fade). Later hubs in
   the session pick one: rings 40%, waves 40%, twinkle 20% (the script at the
   top of the body sets html[data-glow]). The glow image (black wherever
   nothing glows) is .sheen::before, masked by the mode, and .sheen adds it to
   the page (plus-lighter): black adds nothing, so the black between the coins
   is never lit. .sheen is a size container, so the masks line up with the
   body's cover-sized texture on any phone. Off for reduced motion. */
.sheen{position:absolute;inset:0;pointer-events:none;overflow:hidden;container-type:size;
  mix-blend-mode:plus-lighter;opacity:.25}
.sheen::before{content:"";position:absolute;inset:0;background:url(img/hub-runes-glow.png) center top/cover no-repeat;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-image:linear-gradient(transparent,transparent);mask-image:linear-gradient(transparent,transparent)}

@media (prefers-reduced-motion:reduce){.sheen{display:none}}

.top{height:max(260px,42vh);display:flex;flex-direction:column;
  /* the name centres between the top clear line plus 36 and the middle
     block's top */
  justify-content:center;padding-top:calc(var(--top-clear) + 36px);padding-bottom:78px;
  position:relative;flex:0 0 auto;
  /* clear: the page's texture shows through above the plate */
  background:none}
.hubname{margin:0;--rbh:88px} /* the badge (app.css THE BADGE), 88 tall on the hub (Mako 2026-10-31) */
/* THE LAUNCH INTRO (STYLE.md, Motion). While it plays, every letter of the
   full name is its own shape (.ilet) laid over the top area, and the
   badge's own letters are hidden; a glint (.rbglint) crosses the glass as
   it lands. The script builds all of it only while it plays and puts the
   badge back as it was at the end. Reduced motion never gets here. */
.ilet{position:absolute;overflow:visible;pointer-events:none;z-index:2}
.rbglint{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.rbglint i{position:absolute;top:-20%;bottom:-20%;left:0;width:40%;opacity:0;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0))}
/* THE FLOWING RIM (Mako 2026-11-01: the coloured ring 'flows' around). On the hub at rest the
   badge's rim is a ring of its own, .rb.flow::after, in the band the drawn rim takes (9% top and
   bottom, 4% left and right, 2.5 px), coloured by a conic gradient that turns once every 8 s:
   bright blue and bright pink opposite each other, each fading to .35 between. It starts where
   the drawn rim's colours sit (blue top left, pink bottom right) and fades in over it after the
   intro, the drawn rim fading out. Off for reduced motion (no .flow). */
@property --rf{syntax:"<angle>";inherits:false;initial-value:0deg}
.rb.flow::after{content:"";position:absolute;inset:9% 4%;border-radius:999px;padding:2.5px;z-index:1;pointer-events:none;
  background:conic-gradient(from calc(var(--rf) + 315deg),#5DA5EE 0deg,rgba(93,165,238,.35) 90deg,rgba(238,95,156,.35) 90deg,#EE5F9C 180deg,rgba(238,95,156,.35) 270deg,rgba(93,165,238,.35) 270deg,#5DA5EE 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbflow 8s linear infinite,rbin .4s ease-out both}
.rb.flow .rbt,.rb.flow .rbb{animation:rbout .4s ease-out both}
@keyframes rbflow{to{--rf:360deg}}
@keyframes rbin{from{opacity:0}}
@keyframes rbout{to{opacity:0}}

.low{position:relative;margin-top:-40px;
  border-radius:50% 50% 0 0 / 40px 40px 0 0;padding:0 12px;
  flex:1 0 auto;display:flex;flex-direction:column;
  /* THE PLATE'S FROST (Mako 2026-10-31): a light frost, so the texture reads as
     shapes under glass but no rune can be made out, in the calendar card's dark
     plate colour (STYLE.md, Plate frost), so the plate is the same black as the
     other pages' plates, not a grey. The frost is a layer behind
     the blocks, not the plate itself: a plate that blurred would hide the page
     from the blocks' own frost. z-index 0 keeps that layer inside the plate. */
  background:none;z-index:0}
.low::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:rgba(10,11,13,.94)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .low::after{background:rgba(10,11,13,.3);
    -webkit-backdrop-filter:blur(3px) saturate(150%);backdrop-filter:blur(3px) saturate(150%)}
}

.grid{margin-top:-24px;display:flex;flex-wrap:wrap;justify-content:center;
  row-gap:18px;column-gap:12px;padding:0 8px;max-width:420px;margin-left:auto;margin-right:auto}
.blk{width:calc((100% - 24px) / 3);aspect-ratio:1/1;border-radius:20px;padding:11px;
  display:flex;flex-direction:column;justify-content:space-between;color:var(--bone);
  text-decoration:none;transition:transform .16s ease,filter .16s ease;
  /* coloured glass (app.css .cg): the block's colour at --cg in the glass, frosted, see-through */
  background:linear-gradient(rgba(var(--cl),var(--cg)),rgba(var(--cl),var(--cg))),var(--glass);
  /* the drop shadow is the calendar card's; it lifts the block off the plate */
  box-shadow:inset 0 -10px 18px -14px rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.45);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.blk:active{transform:scale(.97);filter:brightness(1.2);transition-duration:.08s}
/* THE BLOCK'S FACE: the icon centred in the space above the name, tinted
   toward the block's own colour and a little see-through, so icon and
   name sit in the glass; the name centred along the bottom. The icon is
   drawn solid and faded as one piece (opacity on the svg, not a
   see-through colour), so the colour never stacks where two lines meet. */
.blk .bi{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;color:rgb(var(--ci,237,234,227))}
.blk .bi svg{width:min(60px, calc(33.33vw - 69.6px));height:min(60px, calc(33.33vw - 69.6px));stroke-width:1.5;--sw:1.5;opacity:.82} /* 60, or less where a narrow phone makes the block too small to hold it */
.blk .bi svg:has(.icb) .ico{display:none}
.blk .bi svg .icb{display:inline}
.blk .bn{font-family:var(--disp);font-weight:700;font-size:15px;text-align:center;color:rgba(var(--ci,237,234,227),.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* M13: "Collection" is the longest name, 77.7 wide in a 76 block at 375; a phone narrower than 390
   draws the names a touch tighter so it fits whole (402, Mako's phone, is unchanged) */
@media (max-width:389px){.blk .bn{letter-spacing:-.02em}}
/* the arc gives about 10px; the extra 4px exaggerates the curve, Mako's call. */
.grid > .blk:nth-child(2), .grid > .blk:nth-child(5){top:-14px}
/* a last row of two spreads a little, so it doesn't hug the centre gap */
.grid > .blk:nth-child(3n+1):nth-last-child(2), .grid > .blk:nth-child(3n+1):nth-last-child(2) + .blk{margin:0 5px}

/* ALL PAGES (M15): the eighth block, always last. Plain glass, no page colour, since it is
   every page; a button that opens the All pages tray. The tray sits where a bar's tray
   would, since the hub has no bar. */
.blk.allp{border:0;font:inherit;cursor:pointer;background:var(--frost-solid)}
/* frosted like the coloured blocks (app.css .cg), so every block is one glass (Mako 2026-10-31) */
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .blk.allp{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
}
#pall{bottom:calc(max(4px,calc(env(safe-area-inset-bottom,0px) - 12px)) + 8px)}

<script>
/* THE HUB'S SCROLL LOCK (css above): checked once the launch has settled
   (iOS stretches the window in its first 0.1s) and on any later resize; only
   a phone too short for the hub scrolls. */
(function () {
  function fit() {
    var d = document.documentElement, b = document.body;
    if (!b) { return; }
    d.classList.toggle("scrolls", b.scrollHeight > window.innerHeight + 1);
  }
  setTimeout(function () { fit(); window.addEventListener("resize", fit); }, 600);
})();
</script>
<script>
/* THE GLOW'S MODE (Mako 2026-10-31): rings on the first hub of a session, then
   rings 40%, waves 40% or twinkle 20% each time the hub opens (see THE GLOW) */
(function () {
  var m = "rings";
  try {
    if (sessionStorage.getItem("ravi.glow.v1")) { var r = Math.random(); m = r < .4 ? "rings" : r < .8 ? "waves" : "twinkle"; }
    else { sessionStorage.setItem("ravi.glow.v1", "1"); }
  } catch (e) {}
  document.documentElement.setAttribute("data-glow", m);
})();
</script>

  // to the next step], from 0 to the end time T.

  // top at the left of its advance) at x, y from the badge's top left. The

    el.style.height = ((RG.asc + RG.desc) * k) + "px";

    el.style.top = (y + (RG.cap - RG.asc) * k) + "px";

<script>
(function(){
  var PAGES = window.RAVI_PAGES || [];

  // THE GRID. Three per row, always: the blocks are the calendar .ev
  // body recipe, coloured by each page's own rgb. Eight blocks at most, so
  // the hub icon (the 3-3-2 grid) stays true: the viewer's picks from App
  // settings (RAVI_HUB_PICKS in pages.js, up to seven, in page order), then
  // All pages, always last (M15, Mako 2026-10-26).
  // A block's icon and name take a pale tint of its own colour.
  function tint(rgb){
    var c = rgb.split(","), o = [];
    for (var t = 0; t < 3; t++) { o.push(Math.round(+c[t] + (255 - +c[t]) * .62)); }
    return o.join(",");
  }
  var grid = document.getElementById("grid");
  var h = "", picks = window.RAVI_HUB_PICKS ? window.RAVI_HUB_PICKS() : [], on = {};
  for (var k = 0; k < picks.length; k++) { on[picks[k]] = true; }
  for (var i = 0; i < PAGES.length; i++) {
    var p = PAGES[i];
    if (!p.path || !on[p.id]) { continue; }
    h += '<a class="blk glass cg" href="' + p.path + '" style="--cl:' + p.rgb + ';--c:' + p.rgb + ';--ci:' + tint(p.rgb) + '" data-k="do"><span class="bi">' + p.icon + '</span><span class="bn">' + p.name + '</span></a>';
  }
  h += '<button type="button" class="blk glass allp" id="hall" aria-haspopup="true" aria-expanded="false" aria-controls="pall" data-k="do"><span class="bi">' + window.RAVI_ICON("allpages") + '</span><span class="bn">All pages</span></button>';
  grid.innerHTML = h;
  // THE BLOCKS RISE IN ONCE PER LAUNCH, with the launch intro (STYLE.md,
  // Motion): one after another, while the name is being read, all done by
  // about 1.25s. Any other visit to the hub shows them at rest.
  if (window.RAVI_INTRO && grid.animate) {
    var bk = grid.children;
    for (var bj = 0; bj < bk.length; bj++) {
      var bo = getComputedStyle(bk[bj]).opacity;
      window.RAVI_INTRO.push(bk[bj].animate(
        [{ transform: "translateY(14px) scale(.96)", opacity: 0 }, { transform: "none", opacity: bo }],
        { duration: 520, delay: 300 + bj * 60, easing: "cubic-bezier(.22,.72,.2,1)", fill: "backwards" }));
    }
  }

  // THE ALL PAGES TRAY: the Go to tiles for every page, App settings last.
  // While it is open the page is locked at the root (html.lock in app.css).
  var pall = document.getElementById("pall"), scrim = document.getElementById("scrim"), hall = document.getElementById("hall"), open = false;
  window.RAVI_GOTO(document.getElementById("pallgoto"), "hub", "", false, true);
  function set(v){
    open = v;
    pall.classList.toggle("show", v); scrim.classList.toggle("show", v);
    document.documentElement.classList.toggle("lock", v);
    pall.setAttribute("aria-hidden", v ? "false" : "true");
    hall.setAttribute("aria-expanded", v ? "true" : "false");
  }
  hall.addEventListener("click", function(){ set(!open); });
  scrim.addEventListener("click", function(){ set(false); });

  /* iOS only fires the pressed state on non-button elements while a touch
     listener exists at document level. The event cards are links. */
  document.addEventListener("touchstart", function(){}, {passive:true});
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap resets the timer so a control tap never arms the guard for
  // whatever is tapped next.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early; pages.js holds off page pinch-zoom
  // (2026-11-02). Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = 0;
      return;
    }
    var tch = ev.changedTouches[0];
    var now = Date.now();
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
