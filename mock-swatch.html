<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Swatch height test</title>
<link rel="stylesheet" href="/van-isle-riftbound/fonts.css">
<style>
  :root{
    --bone:#F2F3F5;--dim:#828A97;--mute:#4E5561;
    --rule:#212429;--rule-hi:#343A44;
    --display:"Archivo",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sw:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:var(--bone);font-family:var(--mono);
    -webkit-user-select:none;user-select:none}
  .pick{position:sticky;top:0;z-index:10;background:#000;
    border-bottom:1px solid var(--rule);padding:10px 12px}
  .pick .lab{font-family:var(--mono);font-weight:500;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .pick .row{display:flex;gap:6px}
  .pick button{flex:1;min-height:38px;background:none;color:var(--dim);
    border:1px solid var(--rule);border-radius:5px;
    font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em}
  .pick button[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:#000}
  .setup{padding:12px}
  .setup h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:14px}
  .grp{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  label{display:block;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .pair{display:flex;gap:8px}
  .pair input{flex:1;min-width:0}
  input{width:100%;min-height:44px;background:#0A0B0E;color:var(--bone);
    border:1px solid var(--rule-hi);border-radius:6px;padding:0 10px;font-family:var(--mono);
    font-weight:500;font-size:16px;margin-bottom:8px;-webkit-appearance:none;appearance:none}
  .lgpbtn{flex:1;min-width:0;height:44px;min-height:44px;background:#0A0B0E;color:var(--bone);
    border:1px solid var(--rule-hi);border-radius:6px;padding:0 10px;text-align:left;
    font-family:var(--mono);font-weight:500;font-size:13px;line-height:42px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .swatches{display:flex;gap:8px}
  .swatches button{flex:1;height:var(--sw);border-radius:6px;border:2px solid transparent;padding:0}
  .swatches button[aria-pressed="true"]{border-color:var(--bone)}
  .first{display:flex;gap:10px}
  .first button{flex:1;min-width:0;min-height:44px;background:none;border:1px solid var(--rule-hi);
    border-radius:6px;color:var(--dim);font-family:var(--display);font-weight:600;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;padding:0 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .first button[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:#000}
  .start{width:100%;min-height:44px;background:var(--bone);border:1px solid var(--bone);
    border-radius:6px;color:#000;font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .done{width:100%;min-height:44px;margin-top:10px;background:none;border:0;
    border-bottom:2px solid rgba(242,243,245,.55);border-radius:0;color:var(--bone);
    font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase}
</style>
</head>
<body>
<div class="pick">
  <div class="lab">Swatch height</div>
  <div class="row" id="pickrow">
    <button type="button" data-h="28">28</button>
    <button type="button" data-h="32">32</button>
    <button type="button" data-h="36">36</button>
    <button type="button" data-h="38">38</button>
    <button type="button" data-h="44" aria-pressed="true">44</button>
  </div>
</div>
<div class="setup">
  <h2>Before the match</h2>
  <div class="grp">
    <label>Player 1</label>
    <div class="pair">
      <input type="text" value="Test" readonly>
      <button type="button" class="lgpbtn">Ambessa, Matriarch of War</button>
    </div>
    <div class="swatches">
      <button type="button" style="background:#3FA9F5"></button>
      <button type="button" style="background:#FF4F9A"></button>
      <button type="button" style="background:#FFB020" aria-pressed="true"></button>
      <button type="button" style="background:#4CD964"></button>
      <button type="button" style="background:#A78BFA"></button>
      <button type="button" style="background:#F2F3F5"></button>
    </div>
  </div>
  <div class="grp">
    <label>Player 2</label>
    <div class="pair">
      <input type="text" value="Brayden" readonly>
      <button type="button" class="lgpbtn">Darius, Hand of Noxus</button>
    </div>
    <div class="swatches">
      <button type="button" style="background:#3FA9F5"></button>
      <button type="button" style="background:#FF4F9A"></button>
      <button type="button" style="background:#FFB020"></button>
      <button type="button" style="background:#4CD964"></button>
      <button type="button" style="background:#A78BFA" aria-pressed="true"></button>
      <button type="button" style="background:#F2F3F5"></button>
    </div>
  </div>
  <div class="grp">
    <label>Match length</label>
    <div class="first">
      <button type="button">Single game</button>
      <button type="button" aria-pressed="true">Best of 3</button>
    </div>
    <label style="margin-top:12px">Who goes first</label>
    <div class="first">
      <button type="button" aria-pressed="true">Test</button>
      <button type="button">Brayden</button>
    </div>
  </div>
  <div class="grp">
    <label>Round timer</label>
    <div class="first">
      <button type="button">30</button>
      <button type="button">50</button>
      <button type="button">60</button>
    </div>
  </div>
  <div class="grp">
    <label>Show on the field</label>
    <div class="first">
      <button type="button">Legend art</button>
      <button type="button">Domains</button>
    </div>
  </div>
  <button type="button" class="start">Start match</button>
  <button type="button" class="done">Back to the game</button>
</div>
<script>
(function(){
  var row = document.getElementById("pickrow");
  row.addEventListener("click", function(e){
    var t = e.target.closest("button");
    if(!t) return;
    var all = row.querySelectorAll("button"), i;
    for(i=0;i<all.length;i++){ all[i].setAttribute("aria-pressed", all[i]===t ? "true" : "false"); }
    document.documentElement.style.setProperty("--sw", t.getAttribute("data-h") + "px");
  });
})();
</script>
</body>
</html>
