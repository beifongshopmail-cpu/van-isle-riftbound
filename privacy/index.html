</section>

<script>
(function(){
  // The one menu on this page: the Go to list. While it is open the page is locked at the root.
  var scrim = document.getElementById("scrim"), pnav = document.getElementById("pnav"), on = false;
  function show(v){
    on = !!v;
    pnav.classList.toggle("show", on); pnav.setAttribute("aria-hidden", on ? "false" : "true");
    scrim.classList.toggle("show", on);
    document.documentElement.classList.toggle("lock", on);
  }
  document.getElementById("tabnav").addEventListener("click", function(){ show(!on); });
  window.RAVI_GOTO(document.getElementById("pnavgoto"), "settings", "../");
  scrim.addEventListener("click", function(){ show(false); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && on) { show(false); } });

  // THE WORDS (words.js): every row starts open here, since the page is for reading; a tap folds one
  var LG = window.RAVI_LEGAL, KINDS = ["privacy", "terms"];
  KINDS.forEach(function(k){
    var el = document.getElementById("lg" + k);
    el.innerHTML = LG.rows(k, true); LG.bind(el);
  });
  // SEARCH, as App settings': every typed word starts a word of a row's title or its words; rows that
  // match stay (opened), a group with none left goes with its label
  var q = document.getElementById("lgq"), qx = document.getElementById("lgqx"), none = document.getElementById("lgnone");
  function find(){
    var ws = q.value.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean), any = false;
    qx.disabled = !q.value;
    KINDS.forEach(function(k){
      var el = document.getElementById("lg" + k), left = 0;
      el.querySelectorAll(".door[aria-controls]").forEach(function(b){
        var x = document.getElementById(b.getAttribute("aria-controls"));
        var have = (b.textContent + " " + x.textContent).toLowerCase().split(/[^a-z0-9]+/);
        var hit = ws.every(function(w){ return have.some(function(h){ return h.indexOf(w) === 0; }); });
        b.hidden = !hit;
        if (hit) { left++; if (ws.length) { b.setAttribute("aria-expanded", "true"); } }
        x.hidden = !hit || b.getAttribute("aria-expanded") !== "true";
      });
      el.hidden = !left; el.previousElementSibling.hidden = !left;
      if (left) { any = true; }
    });
    none.hidden = any;
  }
  q.addEventListener("input", find);
  q.addEventListener("keydown", function(e){ if (e.key === "Enter") { q.blur(); } });
  qx.addEventListener("click", function(){ q.value = ""; find(); q.focus(); });
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap still starts the timer, so a quick tap on words after a control
  // (a menu opened by its row) is held off too.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early; pages.js holds off page pinch-zoom
  // (2026-11-02). Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    var tch = ev.changedTouches[0];
    var now = Date.now();
    // A control's tap goes through at once, but starts the timer: a quick second tap on a menu's
    // words or a gap after tapping the row that opened it is still a double-tap to iPhone
    // (plan 2 M8 close-out, Mako 2026-11-04: tap-to-zoom in menus).
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = now; lastX = tch.clientX; lastY = tch.clientY;
      return;
    }
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
