<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RB Probe">
<title>Bar probe - Van Isle Riftbound</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../app.css">
<style>
/* THROWAWAY, UNLINKED. Measures where the floating bar lands under seven
   page layouts, in the installed app. Remove once the counter's fix lands. */
html.va,html.va body{height:100%;overflow:hidden}
html.vb,html.vb body{overflow:hidden}
html.ve,html.ve body{height:100vh;overflow:hidden}
html.vf,html.vf body{height:100dvh;overflow:hidden}
html.vh,html.vh body{overflow:hidden}
#tall{height:200vh;display:none}
html.vd #tall{display:block}
#stage{display:none;position:fixed;inset:0}
html.vg #stage,html.vh #stage{display:block}
#out{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;
  font-size:13px;line-height:1.45;background:rgba(0,0,0,.6);border-radius:16px;padding:12px}
#out table{width:100%;border-collapse:collapse}
#out td{padding:2px 4px;border-top:1px solid rgba(255,255,255,.08)}
#out td+td{text-align:right}
#out .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#out .row button{height:34px;padding:0 12px;border-radius:999px;background:var(--recess);font-weight:600}
#ins{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0}
#vh100{position:absolute;left:0;top:0;width:1px;height:100vh;visibility:hidden}
</style>
</head>
<body>
<div id="tall"></div>
<div id="stage"></div>
<div id="ins"></div>
<div id="vh100"></div>
<div id="out">Measuring...</div>
<nav class="bar frost" id="bar"><span class="tab"></span><span class="tab"></span><span class="tab"></span><span class="tab"></span></nav>
<script>
(function(){
  var V = [
    ["va", "A: html,body height 100% + hidden (counter today)"],
    ["vb", "B: html,body hidden, no height"],
    ["vc", "C: nothing set, short page"],
    ["vd", "D: nothing set, tall page (trade)"],
    ["ve", "E: height 100vh + hidden"],
    ["vf", "F: height 100dvh + hidden"],
    ["vg", "G: fixed full-screen stage, body untouched"],
    ["vh", "H: G plus html,body hidden"]
  ];
  var html = document.documentElement, out = document.getElementById("out");
  var bar = document.getElementById("bar"), ins = document.getElementById("ins");
  function clear(){ for (var i = 0; i < V.length; i++) { html.classList.remove(V[i][0]); } }
  function measure(){
    var r = bar.getBoundingClientRect();
    return {
      gap: Math.round(screen.height - r.bottom),
      ih: window.innerHeight,
      ch: html.clientHeight,
      vv: window.visualViewport ? Math.round(window.visualViewport.height) : -1
    };
  }
  function run(){
    var rows = [], i;
    for (i = 0; i < V.length; i++) {
      clear(); html.classList.add(V[i][0]); window.scrollTo(0, 0);
      void html.offsetHeight;
      var m = measure();
      rows.push("<tr><td>" + V[i][1] + "</td><td>" + m.gap + "</td><td>" + m.ih + "/" + m.ch + "/" + m.vv + "</td></tr>");
    }
    clear(); html.classList.add("va");
    var cs = getComputedStyle(ins);
    out.innerHTML = "<b>Bar gap to the screen bottom, in px. Trade shows the right one.</b>" +
      "<div>screen " + screen.width + "x" + screen.height + ", 100vh " + document.getElementById("vh100").offsetHeight +
      ", inset top " + cs.paddingTop + " bottom " + cs.paddingBottom +
      ", standalone " + (window.navigator.standalone ? "yes" : "no") + "</div>" +
      "<table><tr><td>layout</td><td>gap</td><td>inner/client/visual</td></tr>" + rows.join("") + "</table>" +
      "<div class=\"row\">" + V.map(function(v){ return "<button type=\"button\" data-v=\"" + v[0] + "\">" + v[0].charAt(1).toUpperCase() + "</button>"; }).join("") +
      "<button type=\"button\" id=\"again\">Measure again</button></div>";
  }
  out.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) { return; }
    if (b.id === "again") { run(); return; }
    clear(); html.classList.add(b.getAttribute("data-v")); window.scrollTo(0, 0);
  });
  setTimeout(run, 400);
})();
</script>
</body>
</html>
