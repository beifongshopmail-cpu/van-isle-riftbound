<style>
/* The Rules page (M9). Riot's errata, FAQs, rulings and legality lists from
   data/rules.json, which fetch-rules.js copies word for word from Riot's
   pages. Nothing here rewrites Riot's words; it only lays them out. The
   shared layer is app.css; this block holds only the page's own rules. */
html{background:var(--ground)}
a{color:inherit;text-decoration:none}
body{-webkit-font-smoothing:antialiased;
  /* THIS DOES NOT STOP DOUBLE-TAP ZOOM. The touchend guard at the end of
     the page is the fix. */
  touch-action:manipulation}
#rl{max-width:480px;margin:0 auto;
  padding:0 12px calc(max(4px,calc(env(safe-area-inset-bottom,0px) - 12px)) + var(--barH) + 40px)}
#home > section,#res{margin-top:22px}
#rchips > .skel,#home .doors > .skel{padding:0;gap:0}   /* the loading blocks (plan 2 M8.7 motion polish) */
#rchips .skpill{width:88px}
/* THE SEARCH STAYS AT THE TOP (M11 sweep, 2026-10-24): it sits in a sticky plate, as Trade's
   and Decks', parked 10 above --top-clear so its words start on it; plate frost, clear. */
.srow{margin-top:14px;position:sticky;top:calc(var(--top-clear) - 10px);z-index:10;--tint:transparent}   /* the plate is chrome: clear */
/* RULES COLOURS BY SECTION, NEVER BY THE PAGE (Mako 2026-10-24): an entry wears its section's colour
   wherever it shows (KC below). */
/* NEW means changed since the last visit (Mako 2026-10-24, in place of the Latest menu): the
   calendar's badge; badges stay while the page is open, leaving it records the visit */
.new{display:inline-block;vertical-align:2px;margin-left:8px;flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--ink);background:var(--bone);padding:1px 6px;border-radius:999px}
.door > .new{vertical-align:0}
/* A list entry that opens in place: the row (.door.rec, kind open) and the
   body under it (.rbody), siblings inside one group. */
.door.rec .t.wrap{white-space:normal;line-height:1.3}
.door.rec .chev{position:absolute;top:14px;right:16px;color:var(--muted)}
.rlab{margin:8px 0 4px;font-family:var(--text);font-size:12px;font-weight:600;color:var(--muted)}
/* Riot's own markup, as fetch-rules.js kept it */
.rtx{font-family:var(--text);font-size:15px;line-height:1.4;color:var(--bone);overflow-wrap:anywhere}
.rtx.old{color:var(--muted)}
.rtx p{margin:0 0 8px}
.rtx > :last-child{margin-bottom:0}
.rtx ul,.rtx ol{margin:0 0 8px;padding-left:20px}
.rtx li{margin:0 0 4px}
.rtx li p{margin:0}
.rtx h1,.rtx h2,.rtx h3,.rtx h4,.rtx h5,.rtx h6{margin:10px 0 6px;font-family:var(--disp);font-size:13px;font-weight:700}
.rtx blockquote{margin:0 0 8px;padding-left:12px;border-left:2px solid var(--track)}
.rtx table{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:13px;line-height:1.35}
.rtx td,.rtx th{vertical-align:top;text-align:left;padding:6px;border:1px solid rgba(255,255,255,.08)}
.rtx a{color:var(--bone);text-decoration:underline;text-underline-offset:2px}
.rtx .rpic{display:inline-block;margin:0 0 8px;font-family:var(--disp);font-size:13px;font-weight:600;color:var(--muted)}
.rsrc{margin:14px 2px 0;font-size:12px;line-height:1.5;color:var(--muted)} /* menu small print, as app.css .pnote */
.rsrc a{color:var(--bone)}
.rnote{margin:0 0 12px;border-radius:22px;background:var(--recess);font-size:13px;line-height:1.45;color:var(--muted)}
.rnote p{margin:0}
.empty{margin:6px 4px 0;font-size:13px;color:var(--muted)}
/* a row that leaves the app (Riot's PDFs) carries the out-arrow (.extl), never the deeper chevron */
/* ONE FILTERS CHIP (plan 2 M8.7 B1; STYLE: three filters or more fold into one chip, as Decks'):
   under the search, inside its plate; it counts what is on and opens Kind and Set as rows */
.bchips{display:flex;gap:6px;margin:10px 0 0}
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:var(--sz-track);padding:0 14px;border-radius:999px;font-family:var(--disp);font-size:13px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--bone);color:var(--ink);box-shadow:none}
.fchip .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--ink);color:var(--bone);font-size:12px}
.fchip svg{width:14px;height:14px}
/* AN ERRATUM SHOWS WHAT CHANGED (plan 2 M8.7 F1): the new text's changed words bold and underlined,
   never colour alone; the old text folds under a quiet row */
mark.chg{background:none;color:var(--bone);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.rold{display:flex;align-items:center;gap:6px;width:100%;min-height:var(--sz-row);padding:0;font-family:var(--disp);font-size:13px;font-weight:600;color:var(--muted);background:none;text-align:left}
.rold .chev{width:16px;height:16px}
/* RIOT'S NOTE (plan 2 M8.7 F2): Riot's warning as one row that opens to Riot's words */
.rnrow{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--sz-row);padding:0 16px;font-family:var(--disp);font-size:13px;font-weight:600;color:var(--muted);background:none;text-align:left}
.rnrow .sp{flex:1}
.rnote .rntx{padding:0 16px 12px}
/* A MATCHED WORD (plan 2 M5): bold and lit, so it never rests on colour alone */
.rtx.old mark.hit{color:var(--bone)}
.extl{width:16px;height:16px;flex:0 0 auto;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style>
</head>

<main id="rl">
  <h2 class="sr">Rules</h2>

  <div class="srow plate glass">
    <div class="sf">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="M15.8 15.8 21 21"/></svg>
      <input id="q" type="search" placeholder="Search cards and rulings" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-k="type">
      <button type="button" class="fbtn fx glass" id="qx" disabled data-k="do" aria-label="Clear search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="bchips" id="rchips"></div>
  </div>

  <section id="res" hidden>
    <div class="shead"><h2>Results</h2><span class="sp"></span><span class="cnt" id="rescnt"></span></div>
    <div id="reslist"></div>
    <p class="empty" id="resnone" hidden>Nothing matches. Try a card name, a few words from the question, or another chip.</p>
  </section>

  <div id="home">
    <section>
      <div class="shead"><h2>Current documents</h2></div>
      <div class="doors" id="docs" style="--tint:rgba(var(--h-jade),var(--cg))"></div>
    </section>
    <section>
      <div class="shead"><h2>Errata</h2></div>
      <div class="doors" id="errata" data-k="deeper" style="--tint:rgba(var(--h-garnet),var(--cg))"></div>
    </section>
    <section>
      <div class="shead"><h2>FAQs and rulings</h2></div>
      <div class="doors" id="faqs" data-k="deeper" style="--tint:rgba(var(--h-gold),var(--cg))"></div>
    </section>
  </div>
  <script>/* the loading blocks (plan 2 M8.7 motion polish): the Filters chip and each section's rows, until the rules come */
  (function(){
    function rows(n){ return '<span class="skel">' + new Array(n + 1).join('<span class="skrow"><i class="sk skl"></i></span>') + '</span>'; }
    document.getElementById("rchips").innerHTML = '<span class="skel"><i class="sk skpill"></i></span>';
    document.getElementById("docs").innerHTML = rows(4); document.getElementById("errata").innerHTML = rows(5); document.getElementById("faqs").innerHTML = rows(4);
  })();</script>
  <p class="empty" id="loadfail" hidden>The rules could not be loaded. Check your connection and open the page again.</p>

</main>

<!-- THE STANDARD BAR: Hub, Go to, the third slot unused for now (dimmed), Settings (dimmed). -->
<nav class="bar frost" id="tabs"></nav>
<script>RAVI_BAR(document.getElementById("tabs"), [

<div class="scrim" id="scrim"></div>

</section>
<!-- Updates (plan 2 M9 block 8, Mako's yes 2026-11-12): the bar's third slot. Riot's patch notes, ban
     list posts and Tournament Rules changelogs (rules.json later), newest first; a row opens in place,

<section class="panel frost" id="pupd" aria-hidden="true" aria-label="Updates">
  <div class="phead"><div class="ht"><h4 class="ttl">Updates</h4><span class="cnt" id="updcnt"></span></div><button type="button" class="circ btn glass" data-close aria-label="Close" data-k="do"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

</section>

</section>

  <div class="pbody" id="artbody"></div>
</section>

<script>
(function(){
  var D = null, BYSRC = {}, SRC = {};
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function day(iso){
    if(!iso) return "";
    var p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Vancouver", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)).split("-");
    return MON[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
  }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }
  // Text only, for search. DOMParser builds an inert document, so Riot's
  // pictures inside the markup are never fetched.
  var PARSE = new DOMParser();
  function strip(h){ return h ? (PARSE.parseFromString(h, "text/html").body.textContent || "").replace(/\s+/g, " ").trim() : ""; }
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>';
  var CVR = '<svg class="cvr" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>';
  var OUT = '<svg class="extl" viewBox="0 0 24 24"><path d="M11 6.5H5a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10.5a2 2 0 0 0 2-2v-6M15 3h6v6M21 3l-9 9"/></svg>';

  // THE SECOND WALL (M14). fetch-rules.js cleans Riot's markup before it is
  // stored; the page cleans it again before showing it, in the inert
  // document above (it runs no script and fetches nothing), keeping only the
  // tags and attributes fetch-rules.js allows. Anything else is unwrapped to
  // its text, or dropped whole with its contents (scripts, styles, frames,
  // svg and math). Pictures stay on Riot's page for now (a link to the
  // article instead); links must be web addresses and open outside the app.
  var KEEP = { P:1, BR:1, STRONG:1, B:1, EM:1, I:1, U:1, S:1, SUP:1, SUB:1, UL:1, OL:1, LI:1, H1:1, H2:1, H3:1, H4:1, H5:1, H6:1,
    BLOCKQUOTE:1, HR:1, TABLE:1, THEAD:1, TBODY:1, TR:1, TH:1, TD:1, A:1, IMG:1 };
  var GONE = { SCRIPT:1, STYLE:1, NOSCRIPT:1, IFRAME:1, FRAME:1, FRAMESET:1, OBJECT:1, EMBED:1, TEMPLATE:1, TEXTAREA:1, SELECT:1,
    TITLE:1, XMP:1, NOEMBED:1, NOFRAMES:1, PLAINTEXT:1, LINK:1, META:1, BASE:1, FORM:1 };
  var HTMLNS = "http://www.w3.org/1999/xhtml", HUB = "https://playriftbound.com/en-us/rules-hub/";
  // a Riot page RAVI links to: https only, else the Rules Hub
  function web(u){ u = String(u || ""); return /^https:\/\/[^\s"<>`]+$/i.test(u) ? u : HUB; }
  function clean(html, url){
    var b = PARSE.parseFromString("<!doctype html><body>" + (html || "") + "</body>", "text/html").body;
    function walk(n){
      var c = n.firstChild, next, t, i, at, v, a;
      while(c){
        next = c.nextSibling;
        if(c.nodeType === 3){ c = next; continue; }
        if(c.nodeType !== 1){ n.removeChild(c); c = next; continue; }
        t = c.namespaceURI === HTMLNS ? c.tagName.toUpperCase() : "";
        if(!t || GONE[t]){ n.removeChild(c); c = next; continue; }
        if(!KEEP[t] || (t === "A" && !/^https?:\/\/[^\s"<>`]+$/i.test(c.getAttribute("href") || ""))){
          next = c.firstChild || next;
          while(c.firstChild) n.insertBefore(c.firstChild, c);
          n.removeChild(c); c = next; continue;
        }
        if(t === "IMG"){
          a = c.ownerDocument.createElement("a");
          a.className = "rpic"; a.href = web(url); a.textContent = "Picture on Riot's page";
          n.replaceChild(a, c); c = a; t = "A";
        }
        for(i = c.attributes.length - 1; i >= 0; i--){
          at = c.attributes[i].name; v = c.attributes[i].value;
          if(t === "A" && at === "href") continue;
          if(c.className === "rpic" && at === "class") continue;
          if((t === "TH" || t === "TD") && (at === "colspan" || at === "rowspan") && /^\d+$/.test(v)) continue;
          c.removeAttribute(at);
        }
        if(c.tagName.toUpperCase() === "A"){ c.setAttribute("target", "_blank"); c.setAttribute("rel", "noopener"); }
        walk(c);
        c = next;
      }
    }
    walk(b);
    return b.innerHTML;
  }
  function rtx(html, url, cls){
    return '<div class="rtx' + (cls ? " " + cls : "") + '">' + clean(html, url) + '</div>';
  }
  function title(it){ return it.cards ? it.cards[0] : (it.q || it.title || ""); }
  function body(it){
    var url = (SRC[it.source] || {}).url || "";
    if(it.kind === "update"){
      return '<div class="rtx">' + esc(UPW[it.what]) + '</div><p class="rsrc"><a href="' + esc(web(it.url)) + '" target="_blank" rel="noopener">Read it on playriftbound.com</a></p>';
    }
    if(it.kind === "errata"){
      return '<p class="rlab">New text</p>' + rtx(it["new"], url) + (it.old ? '<button type="button" class="rold" data-act="rold" aria-expanded="false" data-k="open">Old text' + CHEV + '</button><div hidden>' + rtx(it.old, url, "old") + '</div>' : "");
    }
    return rtx(it.a || it.html, url);
  }
  // One entry: the row that opens in place, and its body under it.
  function entry(it, sub){
    return '<button type="button" class="door btn glass rec" aria-expanded="false" data-id="' + esc(it.id) + '" data-k="open"><span class="t wrap">' + esc(title(it)) + (isNew(it) ? NEWB : '') + '</span>'
      + (sub ? '<small>' + esc(sub) + '</small>' : '') + CHEV + '</button><div class="rbody sel" hidden></div>';
  }
  var ITEM = {};
  function toggle(btn){
    var b = btn.nextElementSibling, open = btn.getAttribute("aria-expanded") === "true";
    if(open){ btn.setAttribute("aria-expanded", "false"); b.hidden = true; return; }   // its words stay while it folds shut (pages.js); the next open rebuilds them
    var it0 = ITEM[btn.getAttribute("data-id")];
    b.innerHTML = body(it0);
    if(it0.kind === "errata" && it0.old) changed(b.querySelector(".rtx:not(.old)"), strip(it0.old));
    b.querySelectorAll(".rtx").forEach(function(x){ window.RAVI_KW_TAGS(x); });   // keywords as the cards print them (plan 2 M8.7 F3)
    if(btn.closest("#reslist")) mark(b);
    btn.setAttribute("aria-expanded", "true");
    b.hidden = false;
    b.querySelectorAll("a").forEach(function(a){ a.target = "_blank"; a.rel = "noopener"; });
    b.classList.remove("reveal"); void b.offsetWidth; b.classList.add("reveal");
  }

  // WHAT CHANGED (plan 2 M8.7 F1): the new text's words that are not in the old text, by the
  // longest common run of words; marked bold and underlined in place, Riot's words untouched
  function changed(root, oldText){
    if(!root) return;
    var RE = /[A-Za-z0-9\u2019'\[\]]+/g, a = (oldText.match(RE) || []).map(norm), tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], n, b = [], i, j;
    while((n = tw.nextNode())) nodes.push(n);
    nodes.forEach(function(t){ (t.nodeValue.match(RE) || []).forEach(function(w){ b.push(norm(w)); }); });
    if(!a.length || !b.length || a.length * b.length > 400000) return;
    var L = [], keep = {};
    for(i = 0; i <= a.length; i++){ L.push(new Uint16Array(b.length + 1)); }
    for(i = a.length - 1; i >= 0; i--) for(j = b.length - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    for(i = 0, j = 0; i < a.length && j < b.length;){ if(a[i] === b[j]){ keep[j] = 1; i++; j++; } else if(L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
    var k = 0;
    nodes.forEach(function(t){
      var txt = t.nodeValue, m, last = 0, frag = null; RE.lastIndex = 0;
      while((m = RE.exec(txt))){
        var hit = !keep[k]; k++;
        if(!hit) continue;
        frag = frag || document.createDocumentFragment();
        if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var mk = document.createElement("mark"); mk.className = "chg"; mk.textContent = m[0]; frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      if(!frag) return;
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  }

  // ---- menus: one on screen, a stack behind it (as on the trade page) ----
  var OPENP = null, STACK = [];
  function slideMenus(from, to, dir){
    from.classList.remove("fromr", "froml", "tol", "tor");
    from.classList.add(dir > 0 ? "tol" : "tor");
    to.classList.remove("fromr", "froml", "tol", "tor");
    to.classList.add(dir > 0 ? "fromr" : "froml");
    void to.offsetWidth;
    setTimeout(function(){ from.classList.remove("tol", "tor"); }, 360);
  }
  function show(p, keep, dir){
    var sc = el("scrim"), b;
    if(OPENP && p && OPENP !== p && dir) slideMenus(OPENP, p, dir);
    if(OPENP && OPENP !== p){ OPENP.classList.remove("show"); OPENP.setAttribute("aria-hidden", "true"); }
    OPENP = p || null;
    var xs = document.querySelectorAll(".phead [data-close]"), i;
    for(i = 0; i < xs.length; i++){ xs[i].hidden = STACK.length > 1 && xs[i].closest(".panel") === p; }
    document.querySelectorAll(".panel .back").forEach(function(bk){ bk.hidden = !(STACK.length > 1 && bk.closest(".panel") === p); });
    if(p){
      document.documentElement.classList.add("lock");
      p.classList.add("show"); p.classList.remove("fromr", "froml");
      p.setAttribute("aria-hidden", "false");

      document.documentElement.classList.remove("lock");
      sc.classList.remove("show");
    }
  }
  function openPanel(p){ STACK = p ? [p] : []; show(p); }
  function deeper(p){ STACK.push(p); show(p, false, 1); }
  function back(){ STACK.pop(); show(STACK.length ? STACK[STACK.length - 1] : null, true, -1); }

  // An article's menu: its entries (grouped as Riot groups them), then the
  // source line and Riot's own warning where it has one.
  function fillArticle(id){
    var s = SRC[id], list = BYSRC[id] || [], h = "", group = null, open = false, i;
    el("part").style.setProperty("--tint", kc(s.kind));
    el("arttl").textContent = s.kind === "hub" ? s.title : cap(s.set) + (s.kind === "errata" ? " errata" : " FAQ");
    el("artcnt").textContent = list.length;
    if(s.notice) h += '<div class="rnote"><button type="button" class="rnrow" data-act="rnote" aria-expanded="false" data-k="open"><span>Riot\'s note</span><span class="sp"></span>' + CHEV + '</button><div class="rntx" hidden>' + clean(s.notice, s.url) + '</div></div>';
    for(i = 0; i < list.length; i++){
      var it = list[i], g = it.kind === "errata" ? (it.group || "") : (it.group || it.section || "");
      if(i === 0 || g !== group){
        if(open) h += '</div></div>';
        h += '<div class="row">' + (g ? '<p class="lb">' + esc(g) + '</p>' : '') + '<div class="doors" data-k="open">';
        open = true; group = g;
      }
      h += entry(it);
    }
    if(open) h += '</div></div>';
    h += '<p class="rsrc">' + esc(s.title) + (s.published ? ', published ' + day(s.published) : '') + '. <a href="' + esc(web(s.url)) + '" target="_blank" rel="noopener">Read it on playriftbound.com</a></p>';
    el("artbody").innerHTML = h;
    el("artbody").querySelectorAll(".door .t").forEach(function(x){ window.RAVI_KW_TAGS(x); });   // a question that names a keyword or a symbol
  }
  function fillLegal(it){
    var s = SRC[it.source];
    el("part").style.setProperty("--tint", kc("legal"));
    el("arttl").textContent = it.title;
    el("artcnt").textContent = "";
    el("artbody").innerHTML = rtx(it.html, s.url) + '<p class="rsrc">From Riot\'s Rules Hub. <a href="' + esc(web(s.url)) + '" target="_blank" rel="noopener">Open it on playriftbound.com</a></p>';
    el("artbody").querySelectorAll(".rtx").forEach(function(x){ window.RAVI_KW_TAGS(x); });
  }

  // ---- Updates (the bar's third slot): Riot's posts about what changed in the rules, which the
  // page's sections do not hold: Core Rules patch notes, ban list posts, Tournament Rules changelogs
  // (rules.json later). Each is rebuilt from checked fields; its title loses Riot's filing tags
  // ('[Article]', a trailing code) and nothing else. NEW as the page's entries: posted since the last visit.
  var UPD = [], UPK = { ban: "Ban list", tourn: "Tournament Rules", core: "Core Rules", other: "Rules" };
  var UPW = { ban: "Riot's post on the cards banned or unbanned.", tourn: "Riot's notes on what changed in the Tournament Rules.", core: "Riot's notes on what changed in the Core Rules.", other: "A rules post from Riot." };
  function updLoad(){
    UPD = [];
    (Array.isArray(D.later) ? D.later : []).forEach(function(l, i){
      if(!l || typeof l.title !== "string" || typeof l.url !== "string" || typeof l.published !== "string" || !/^\d{4}-\d{2}-\d{2}/.test(l.published)) return;
      var t = l.title.replace(/^\s*\[[^\]]*\]\s*/, "").replace(/\s*\[[A-Za-z0-9_]+\]\s*$/, "").trim().slice(0, 160);
      if(!t) return;
      var what = /\bbans?\b|ban list/i.test(t) ? "ban" : (/tournament rules|changelog/i.test(t) ? "tourn" : (/patch notes|core rules/i.test(t) ? "core" : "other"));
      var it = { id: "upd#" + i, kind: "update", what: what, title: t, url: l.url, published: l.published, changed: l.published.slice(0, 10) };
      UPD.push(it); ITEM[it.id] = it;
    });
    UPD.sort(function(a, b){ return a.published < b.published ? 1 : (a.published > b.published ? -1 : 0); });
  }
  function fillUpd(){
    var h = "";
    UPD.forEach(function(it){ h += entry(it, day(it.published) + " \u00b7 " + UPK[it.what]); });
    el("updrows").innerHTML = h || '<p class="empty">No updates from Riot yet.</p>';
    el("updcnt").textContent = UPD.length || "";
  }

  // ---- the page ----
  // NEW SINCE THE LAST VISIT (in place of the Latest menu, Mako 2026-10-24): an entry or document whose
  // 'changed' day (fetch-rules.js) is after the visit stored in vir.rules.seen.v1. A first visit is the
  // baseline: nothing is NEW. Badges stay while the page is open; leaving it records the newest change.
  var SEENK = "vir.rules.seen.v1", SEEN = null, NEWB = '<span class="new">NEW</span>';
  function isNew(it){ return !!(SEEN && it && it.changed && it.changed > SEEN); }
  function newest(){ var m = ""; D.items.forEach(function(it){ if(it.changed && it.changed > m) m = it.changed; }); UPD.forEach(function(u){ if(u.changed > m) m = u.changed; }); return m; }
  function seenStart(){
    try{ SEEN = localStorage.getItem(SEENK); }catch(e){ SEEN = null; }
    if(!SEEN){ SEEN = newest(); try{ localStorage.setItem(SEENK, SEEN); }catch(e){} }
    var leave = function(){ try{ localStorage.setItem(SEENK, newest()); }catch(e){} };
    window.addEventListener("pagehide", leave);
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") leave(); });
  }
  // THE SECTION COLOURS, one place: a new section adds its kind here (and its colour from the palette)
  var KC = { doc: window.RAVI_HUE("jade"), legal: window.RAVI_HUE("jade"), errata: window.RAVI_HUE("garnet"), faq: window.RAVI_HUE("gold"), ruling: window.RAVI_HUE("gold") };
  function kc(kind){ return "rgba(" + (KC[kind] || KC.faq) + ",var(--cg))"; }
  function srcRow(s, act){
    var n = (BYSRC[s.id] || []).length, unit = s.kind === "errata" ? (n === 1 ? " card" : " cards") : (n === 1 ? " entry" : " entries");
    return '<button type="button" class="door btn glass" data-act="' + act + '" data-src="' + esc(s.id) + '" data-k="deeper"><span class="t">' + esc(cap(s.set)) + '</span>' + ((BYSRC[s.id] || []).some(isNew) ? NEWB : '') + '<span class="sp"></span><small>' + n + unit + '</small>' + CVR + '</button>';
  }
  function render(){
    var docs = "", err = "", faq = "", i;
    var hub = BYSRC.hub || [];
    hub.forEach(function(it){
      if(it.kind === "doc"){
        var up = /last updated:\s*([^<)]+)/i.exec(it.html);
        docs += '<a class="door btn glass act" href="' + esc(web(it.url)) + '" target="_blank" rel="noopener" data-k="do"><span class="t">' + esc(it.title) + '</span>' + (isNew(it) ? NEWB : '') + '<span class="sp"></span>' + (up ? '<small>' + esc(up[1].trim()) + '</small>' : '') + OUT + '</a>';
      }
    });
    hub.forEach(function(it){
      if(it.kind === "legal"){
        docs += '<button type="button" class="door btn glass" data-act="legal" data-id="' + esc(it.id) + '" data-k="deeper"><span class="t">' + esc(it.title) + '</span>' + (isNew(it) ? NEWB : '') + '<span class="sp"></span>' + CVR + '</button>';
      }
    });
    var srcs = D.sources.filter(function(s){ return s.kind !== "hub"; }).sort(function(a, b){ return (b.published || "").localeCompare(a.published || ""); });
    srcs.forEach(function(s){
      if(s.kind === "errata") err += srcRow(s, "art");
      else faq += srcRow(s, "art");
    });
    el("docs").innerHTML = docs;
    el("errata").innerHTML = err;
    el("faqs").innerHTML = faq;
    window.RAVI_EDGES && window.RAVI_EDGES();
  }

  // ---- SEARCH (plan 2 M5; NEXT -- Rules page follow-ups, item 1: 'intuitive, useful, forgiving').
  // Every word typed must match a word in the entry: the word itself or one of its forms
  // (conquer, conquers, conquered, conquering), a word it starts (while still typing), or one
  // close to it (a letter or two off: a typo). The card's own name ranks first, then the question
  // or title, then the text. Matched words are marked. The chips under the search narrow it by
  // kind and by set, one of each; with no search they list everything they choose. All in the
  // page; nothing is sent anywhere. ----
  var IDX = [], VOC = {}, VK = [], HITS = null, FK = "", FS = "";
  var STOP = { the:1, and:1, for:1, you:1, your:1, are:1, can:1, with:1, that:1, this:1, does:1, what:1, when:1, how:1, its:1, has:1, have:1, not:1, but:1, from:1, into:1 };
  function norm(w){ return w.toLowerCase().replace(/[’']/g, ""); }
  function words(t){ return (String(t || "").toLowerCase().replace(/[’']/g, "").match(/[a-z0-9]+/g)) || []; }
  function stem(w){
    if(w.length > 5 && /ing$/.test(w)) w = w.slice(0, -3);
    else if(w.length > 4 && /(ied|ies)$/.test(w)) w = w.slice(0, -3) + "y";
    else if(w.length > 4 && /ed$/.test(w)) w = w.slice(0, -2);
    else if(w.length > 4 && /(s|x|z|ch|sh)es$/.test(w)) w = w.slice(0, -2);
    else if(w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) w = w.slice(0, -1);
    if(w.length > 4 && /e$/.test(w)) w = w.slice(0, -1);
    return w;
  }
  // at most k edits apart (a swap of two letters counts as one), with an early way out
  function near(a, b, k){
    if(Math.abs(a.length - b.length) > k) return false;
    var m = a.length, n = b.length, p2 = null, p1 = [], cur, i, j, low, v;
    for(j = 0; j <= n; j++) p1[j] = j;
    for(i = 1; i <= m; i++){
      cur = [i]; low = i;
      for(j = 1; j <= n; j++){
        v = Math.min(p1[j] + 1, cur[j - 1] + 1, p1[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        if(p2 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) v = Math.min(v, p2[j - 2] + 1);
        cur[j] = v; if(v < low) low = v;
      }
      if(low > k) return false;
      p2 = p1; p1 = cur;
    }
    return p1[n] <= k;
  }
  // how well a typed word matches a word of the text: 3 the word or its form, 2 the start of it, 1 a typo
  function level(q, qs, w, ws){
    if(w === q || ws === qs) return 3;
    if(q.length >= 3 && w.indexOf(q) === 0) return 2;
    var k = q.length >= 8 ? 2 : q.length >= 4 ? 1 : 0;
    return k && near(qs, ws, k) ? 1 : 0;
  }
  function find(q){
    var qs = words(q), tot = null, hit = {}, i, j, x;
    qs.forEach(function(qw){
      var qst = stem(qw), best = {};
      for(i = 0; i < VK.length; i++){
        var w = VK[i], lv = level(qw, qst, w.w, w.s);
        if(!lv) continue;
        if(qw.length >= 3 && !STOP[qw]) hit[w.w] = 1;
        for(j = 0; j < w.at.length; j++){
          x = w.at[j];
          var sc = lv * 2 + (x.where === 2 ? 6 : x.where === 1 ? 3 : 0);
          if(!(best[x.i] >= sc)) best[x.i] = sc;
        }
      }
      if(tot === null) tot = best;
      else { var next = {}; for(var id in tot){ if(best[id] !== undefined) next[id] = tot[id] + best[id]; } tot = next; }
    });
    var ids = Object.keys(tot || {}).map(Number);
    ids.sort(function(a, b){ return (tot[b] - tot[a]) || (a - b); });
    return { ids: ids, hit: hit };
  }
  // the matched words, marked wherever they show in the results (names and opened text)
  function mark(root){
    if(!HITS) return;
    var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], n;
    while((n = tw.nextNode())){ if(!(n.parentNode && n.parentNode.closest && n.parentNode.closest("mark"))) nodes.push(n); }
    nodes.forEach(function(t){
      var txt = t.nodeValue, re = /[A-Za-z0-9’']+/g, m, last = 0, frag = null;
      while((m = re.exec(txt))){
        if(!HITS[norm(m[0])]) continue;
        frag = frag || document.createDocumentFragment();
        if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
        var k = document.createElement("mark"); k.className = "hit"; k.textContent = m[0]; frag.appendChild(k);
        last = m.index + m[0].length;
      }
      if(!frag) return;
      if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
  }
  function kindOf(it){ return it.kind === "errata" ? "errata" : "faq"; }
  var DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';
  var KINDS = [["errata", "Errata"], ["faq", "FAQs"]], FL = "k";
  function sets(){
    var out = [], seen = {};
    D.sources.slice().sort(function(a, b){ return String(a.published || "").localeCompare(String(b.published || "")); }).forEach(function(s){
      if(s.set && (s.kind === "errata" || s.kind === "faq") && !seen[s.set]){ seen[s.set] = 1; out.push(s.set); }
    });
    return out;
  }
  function chips(){
    var n = (FK ? 1 : 0) + (FS ? 1 : 0);
    el("rchips").innerHTML = '<button type="button" class="fchip btn glass' + (n ? " on" : "") + '" data-act="fls" data-k="do" data-fills="pfls" aria-label="Filters' + (n ? ", " + n + " on" : "") + '">Filters' + (n ? '<span class="n">' + n + '</span>' : DOWN) + '</button>';
  }
  function fillFls(){
    var kv = FK ? (FK === "errata" ? "Errata" : "FAQs") : "Any", sv = FS ? cap(FS) : "Any", cv = '<svg class="cvr" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>';
    el("flsrows").innerHTML = '<button type="button" class="door" data-act="fl" data-f="k"><span class="t">Kind</span><span class="sp"></span><small>' + esc(kv) + '</small>' + cv + '</button>'
      + '<button type="button" class="door" data-act="fl" data-f="s"><span class="t">Set</span><span class="sp"></span><small>' + esc(sv) + '</small>' + cv + '</button>';
    el("pfls").querySelector('[data-act="flsall"]').disabled = !(FK || FS);
  }
  function fillFl(){
    var opts = FL === "k" ? KINDS : sets().map(function(x){ return [x, cap(x)]; }), cur = FL === "k" ? FK : FS;
    el("flttl").textContent = FL === "k" ? "Kind" : "Set";
    el("flpick").innerHTML = [["", "Any"]].concat(opts).map(function(o){ var on = cur === o[0]; return '<button type="button" data-act="flpick" data-v="' + esc(o[0]) + '"' + (on ? ' class="on"' : '') + ' aria-pressed="' + on + '">' + esc(o[1]) + '</button>'; }).join("");
  }
  function search(){
    var q = el("q").value.trim(), on = !!(q || FK || FS);
    el("qx").disabled = !q;
    el("home").hidden = on;
    el("res").hidden = !on;
    if(!on){ HITS = null; el("reslist").innerHTML = ""; return; }
    var list, cut = Infinity;
    if(q){ var f = find(q); list = f.ids.map(function(i){ return IDX[i]; }); HITS = Object.keys(f.hit).length ? f.hit : null; cut = 40; }
    else { list = IDX.slice(); HITS = null; }
    list = list.filter(function(x){ return (!FK || kindOf(x.it) === FK) && (!FS || x.it.set === FS); });
    var all = list.length;
    list = list.slice(0, cut);
    // RESULTS BY KIND, each in its section's colour (Mako 2026-10-24: not the page's green): Errata
    // garnet, then FAQs and rulings gold, as the sections below them; the order inside each kept
    var h = "", err = "", faq = "";
    list.forEach(function(x){ var e = entry(x.it, (SRC[x.it.source] || {}).title); if(x.it.kind === "errata") err += e; else faq += e; });
    if(err) h += '<div class="row"><p class="lb">Errata</p><div class="doors" data-k="open" style="--tint:rgba(var(--h-garnet),var(--cg))">' + err + '</div></div>';
    if(faq) h += '<div class="row"><p class="lb">FAQs and rulings</p><div class="doors" data-k="open" style="--tint:rgba(var(--h-gold),var(--cg))">' + faq + '</div></div>';
    el("reslist").innerHTML = h;
    el("reslist").hidden = !list.length;
    el("resnone").hidden = !!list.length;
    el("rescnt").textContent = all > list.length ? "first " + list.length : list.length;
    mark(el("reslist"));
  }

  function boot(){
    D.sources.forEach(function(s){ SRC[s.id] = s; });
    D.items.forEach(function(it){
      ITEM[it.id] = it;
      (BYSRC[it.source] = BYSRC[it.source] || []).push(it);
      if(it.kind === "doc" || it.kind === "legal") return;
      var head = title(it), i = IDX.length, where = {};
      IDX.push({ it: it });
      // 2 the card's own name, 1 the question or title, 0 the text
      words(strip(it["new"]) + " " + strip(it.old) + " " + strip(it.a) + " " + strip(it.html) + " " + (it.group || "")).forEach(function(w){ where[w] = 0; });
      words(head).forEach(function(w){ where[w] = 1; });
      words((it.cards || []).join(" ")).forEach(function(w){ where[w] = 2; });
      Object.keys(where).forEach(function(w){ (VOC[w] = VOC[w] || []).push({ i: i, where: where[w] }); });
    });
    VK = Object.keys(VOC).map(function(w){ return { w: w, s: stem(w), at: VOC[w] }; });
    chips();
    updLoad();
    seenStart();
    render();
  }

  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act],[data-close],.door.rec[aria-expanded]");
    if(!t) return;
    if(t.matches(".door.rec[aria-expanded]")){ toggle(t); return; }
    if(t.hasAttribute("data-close")){ openPanel(null); return; }
    var a = t.getAttribute("data-act");
    if(a === "back"){ back(); return; }
    if(a === "art"){
      fillArticle(t.getAttribute("data-src"));
      openPanel(el("part"));
      return;
    }
    if(a === "legal"){ fillLegal(ITEM[t.getAttribute("data-id")]); openPanel(el("part")); return; }
    if(a === "fls"){ fillFls(); openPanel(OPENP === el("pfls") ? null : el("pfls")); return; }
    if(a === "fl"){ FL = t.getAttribute("data-f"); fillFl(); deeper(el("pfl")); return; }
    if(a === "flpick"){ var v = t.getAttribute("data-v"); if(FL === "k") FK = v; else FS = v; chips(); search(); fillFls(); back(); return; }
    if(a === "flsall"){ FK = ""; FS = ""; chips(); search(); openPanel(null); return; }
    if(a === "rold"){ var o = t.nextElementSibling, on = t.getAttribute("aria-expanded") !== "true"; t.setAttribute("aria-expanded", on ? "true" : "false"); o.hidden = !on; if(on){ o.classList.remove("reveal"); void o.offsetWidth; o.classList.add("reveal"); } return; }
    if(a === "rnote"){ var nb = t.nextElementSibling, nn = t.getAttribute("aria-expanded") !== "true"; t.setAttribute("aria-expanded", nn ? "true" : "false"); nb.hidden = !nn; return; }
  });
  el("scrim").addEventListener("click", function(){ openPanel(null); });
  el("tabnav").addEventListener("click", function(){ openPanel(OPENP === el("pnav") ? null : el("pnav")); });
  window.RAVI_GOTO(el("pnavgoto"), "rules", "../");
  el("pnhere").addEventListener("click", function(){ openPanel(null); });
  el("tabupd").addEventListener("click", function(){ if(OPENP === el("pupd")){ openPanel(null); return; } if(D){ fillUpd(); } openPanel(el("pupd")); });
  el("q").addEventListener("input", search);
  el("qx").addEventListener("click", function(){ el("q").value = ""; search(); el("q").focus(); });

  fetch("../data/rules.json", { cache: "no-cache" }).then(function(r){ return r.json(); }).then(function(d){ D = d; boot(); })
    .catch(function(){ el("home").hidden = true; el("loadfail").hidden = false; });
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap still starts the timer, so a quick tap on words after a control
  // (a menu opened by its row) is held off too.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early; pages.js holds off page pinch-zoom
  // (2026-11-02). Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    var tch = ev.changedTouches[0];
    var now = Date.now();
    // A control's tap goes through at once, but starts the timer: a quick second tap on a menu's
    // words or a gap after tapping the row that opened it is still a double-tap to iPhone
    // (plan 2 M8 close-out, Mako 2026-11-04: tap-to-zoom in menus).
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = now; lastX = tch.clientX; lastY = tch.clientY;
      return;
    }
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
</body>
</html>
