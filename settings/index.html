<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090A">
<meta name="description" content="App settings for RAVI: where the app opens, and the opening animation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAVI">
<link rel="manifest" href="../manifest.webmanifest">

<title>Settings - RAVI</title>

<style>
/* App settings. The shared layer (tokens, glass, the bar, menus, the
   footer) is app.css; this block holds only this page's own rules. Each
   section is a glass card holding a sunken pick group, like the
   calendar's card and the feedback form. */
html{background:var(--ground)}
a{color:inherit;text-decoration:none}
body{-webkit-font-smoothing:antialiased;touch-action:manipulation}
#st{max-width:480px;margin:0 auto;
  padding:0 12px calc(max(4px,calc(env(safe-area-inset-bottom,0px) - 12px)) + var(--barH) + 40px)}
.sth{padding:14px 4px 0}
.sth h2{font-size:28px;line-height:1.1}
.sts{margin-top:20px;border-radius:22px;padding:14px 12px 12px}
.sts .shead{margin:0 4px 10px}
.sts .shead h2{font-size:17px}
.stn{margin:10px 4px 0;font-size:12px;line-height:1.5;color:var(--muted)}
/* the reset slot while it waits for its second tap */
.tab.armed{background:var(--glass-press)}
.starm{margin:14px 4px 0;font-size:12px;line-height:1.5;color:var(--bone);text-align:center;visibility:hidden}
.starm.show{visibility:visible}
</style>
</head>
<body>

<div class="wmrow"><h1 class="wm"><span class="logo1">RA</span><span class="logo2">VI</span></h1></div>

<main id="st">
  <header class="sth"><h2 class="ttl">App settings</h2></header>

  <section class="sts glass">
    <div class="shead"><h2>Open the app to</h2></div>
    <div class="pick" id="opento" data-k="pick"></div>
    <p class="stn">The app opens to the page you pick here. Tap Hub on any page to come back.</p>
  </section>

  <section class="sts glass">
    <div class="shead"><h2>Motion</h2></div>
    <div class="pick" id="stmotion" data-k="pick"><button type="button" id="stintro" aria-pressed="true" class="on">Opening animation</button></div>
    <p class="stn">The RAVI name forming when the app opens.</p>
  </section>

  <p class="starm" id="starm" aria-live="polite">Tap reset again to put every setting back.</p>
</main>

<div class="scrim" id="scrim"></div>
<section class="panel frost tray" id="pnav" aria-hidden="true" aria-label="Pages">
  <div class="pbody"><div class="goto" id="pnavgoto"></div></div>
</section>

<script>
(function(){
  // One menu on this page, the Go to list. While it is open the page is
  // locked at the root (html.lock in app.css); the body is never pinned.
  var pnav = document.getElementById("pnav"), scrim = document.getElementById("scrim"), open = false;
  function set(on){
    open = on;
    if (on) { pnav.classList.add("show"); scrim.classList.add("show"); document.documentElement.classList.add("lock"); }
    else { pnav.classList.remove("show"); scrim.classList.remove("show"); document.documentElement.classList.remove("lock"); }
    pnav.setAttribute("aria-hidden", on ? "false" : "true");
  }
  document.getElementById("tabnav").addEventListener("click", function(){ set(!open); });
  window.RAVI_GOTO(document.getElementById("pnavgoto"), "settings", "../");
  // Settings has no Go to tile of its own, so there is no current tile.
  var here = document.getElementById("pnhere");
  if (here) { here.addEventListener("click", function(){ set(false); }); }
  scrim.addEventListener("click", function(){ set(false); });
})();
</script>
<script>
(function(){
  // THE SETTINGS. Both live on this phone only (local storage):
  //   vir.hub.open.v1   the page the app opens to (no key: the hub);
  //                     the hub's open-to check at its top reads it
  //   ravi.intro.off.v1 "1" turns the hub's launch intro off
  // Reset (the bar's third slot) asks for a second tap, then removes both.
  var OKEY = "vir.hub.open.v1", IKEY = "ravi.intro.off.v1";
  var PAGES = window.RAVI_PAGES || [];
  var opento = document.getElementById("opento"), intro = document.getElementById("stintro");
  var reset = document.getElementById("streset"), armline = document.getElementById("starm");
  function get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v){ try { if (v === null) { localStorage.removeItem(k); } else { localStorage.setItem(k, v); } } catch (e) {} }
  function row(id, name, on){ return '<button type="button" class="' + (on ? "on" : "") + '" data-id="' + id + '">' + name + '</button>'; }
  function render(){
    var c = get(OKEY) || "", h = row("", "Hub", c === "");
    for (var i = 0; i < PAGES.length; i++) {
      var p = PAGES[i];
      if (!p.path || p.id === "settings") { continue; }
      h += row(p.id, p.name, c === p.id);
    }
    opento.innerHTML = h;
    var on = !get(IKEY);
    intro.classList.toggle("on", on);
    intro.setAttribute("aria-pressed", on ? "true" : "false");
  }
  opento.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) { return; }
    var id = t.getAttribute("data-id");
    put(OKEY, id ? id : null);
    render();
  });
  intro.addEventListener("click", function(){
    put(IKEY, get(IKEY) ? null : "1");
    render();
  });
  var armed = false, armT = 0;
  function disarm(){ armed = false; clearTimeout(armT); reset.classList.remove("armed"); armline.classList.remove("show"); }
  reset.addEventListener("click", function(){
    if (!armed) {
      armed = true; reset.classList.add("armed"); armline.classList.add("show");
      armT = setTimeout(disarm, 3000);
      return;
    }
    put(OKEY, null); put(IKEY, null);
    disarm();
    render();
  });
  render();
})();
</script>
<script>
(function(){
  // Double-tap-to-zoom guard. iOS Safari offers a zoom-to-fit gesture on
  // text blocks, and no CSS property suppresses it -- touch-action,
  // user-select and touch-callout were all tested and none is the lever.
  // Swallowing the second tap is. A second touch within 320ms and 30px of
  // the previous one is the gesture, and preventDefault on that touchend
  // cancels it.
  //
  // Controls and links are skipped outright. They were already immune to
  // the gesture, and guarding them costs a visible delay on fast repeated
  // taps -- quantity steppers and scoring buttons in particular. A skipped
  // tap resets the timer so a control tap never arms the guard for
  // whatever is tapped next.
  //
  // A scroll is a move, not a tap, and never reaches this. A pinch carries
  // more than one touch point and returns early, so pinch-to-zoom still
  // works. Attached at document level so it covers fixed overlays and
  // anything added later.
  var SKIP = "button,a,input,select,textarea,label,summary,[role=button]";
  var lastT = 0, lastX = 0, lastY = 0;
  document.addEventListener("touchend", function(ev){
    if (ev.touches.length > 0) return;
    if (ev.changedTouches.length !== 1) return;
    if (ev.target.closest && ev.target.closest(SKIP)){
      lastT = 0;
      return;
    }
    var tch = ev.changedTouches[0];
    var now = Date.now();
    var dx = Math.abs(tch.clientX - lastX);
    var dy = Math.abs(tch.clientY - lastY);
    if (now - lastT < 320 && dx < 30 && dy < 30){
      ev.preventDefault();
    }
    lastT = now; lastX = tch.clientX; lastY = tch.clientY;
  }, {passive:false});
})();
</script>
