<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tap zoom test 2</title>
<style>
  *,*::before,*::after{box-sizing:border-box;touch-action:manipulation}
  html,body{margin:0;padding:0;background:#000;color:#F2F3F5;
    font-family:ui-monospace,monospace;font-size:13px;touch-action:manipulation}
  .zone{padding:14px;border-bottom:6px solid #343A44}
  .zh{font-size:15px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;margin:0 0 12px;color:#FFB020}
  .bar{display:flex;align-items:center;min-height:44px;
    border:1px solid #212429;border-radius:9px;padding:0 14px}
  .bar b{font-size:15px}

  /* ZONE E -- CONTROL. The shipped shape: flex with a gap. */
  #e .bar{gap:12px}

  /* ZONE F -- no gap. The child carries a margin instead. */
  #f .bar{gap:0}
  #f .bar b{margin-right:12px}

  /* ZONE G -- children stretch to fill the whole bar, no free space. */
  #g .bar{gap:0}
  #g .bar b{margin-right:12px}
  #g .bar span{flex:1 1 auto}

  /* ZONE H -- children stretch AND the bar is a button, not a div. */
  #h .bar{gap:0;width:100%;background:none;color:inherit;font:inherit;
    text-align:left;-webkit-appearance:none;appearance:none}
  #h .bar b{margin-right:12px}
  #h .bar span{flex:1 1 auto}
</style>
</head>
<body>

<div class="zone" id="e">
  <p class="zh">Zone E control gap</p>
  <div class="bar"><b>October</b><span>tap the space right of this</span></div>
</div>

<div class="zone" id="f">
  <p class="zh">Zone F margin not gap</p>
  <div class="bar"><b>October</b><span>tap the space right of this</span></div>
</div>

<div class="zone" id="g">
  <p class="zh">Zone G children fill</p>
  <div class="bar"><b>October</b><span>tap the space right of this</span></div>
</div>

<div class="zone" id="h">
  <p class="zh">Zone H fill and button</p>
  <button type="button" class="bar"><b>October</b><span>tap the space right of this</span></button>
</div>

</body>
</html>
